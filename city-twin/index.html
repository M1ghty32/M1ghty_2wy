<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>四川吉利学院 · 真实校园底图 v2</title>
<style>
  :root {
    --bg: #06101a;
    --cyan: #38e1ff;
    --muted: #7f95a8;
    --line: rgba(120, 190, 220, .18);
    --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; color: #dbeaf6; }
  #scene { position: fixed; inset: 0; }
  canvas { display: block; }

  #head {
    position: fixed; top: 18px; left: 20px; z-index: 5;
    display: flex; flex-direction: column; gap: 4px;
    pointer-events: none;
  }
  #head b { font-size: 15px; letter-spacing: .12em; }
  #head span { color: var(--muted); font-family: var(--mono); font-size: 9px; letter-spacing: .18em; }
  #head em { color: var(--cyan); font-style: normal; }

  #dock {
    position: fixed; top: 18px; right: 20px; z-index: 6;
    display: flex; gap: 6px;
  }
  #dock .dock-link {
    display: inline-flex; align-items: center; padding: 7px 11px; border: 1px solid rgba(56,225,255,.35); border-radius: 8px;
    background: rgba(56,225,255,.12); color: #cdf3ff; font-size: 11px; text-decoration: none;
  }
  #dock .dock-link:hover { background: rgba(56,225,255,.2); }
  #dock button {
    padding: 7px 11px; border: 1px solid var(--line); border-radius: 8px;
    background: rgba(8, 18, 28, .72); color: #cfe6f6; font-size: 11px; cursor: pointer;
    backdrop-filter: blur(8px);
  }
  #dock button:hover { border-color: rgba(56, 225, 255, .5); color: #fff; }

  #info {
    position: fixed; left: 20px; bottom: 20px; z-index: 5;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: rgba(6, 16, 26, .72); backdrop-filter: blur(8px);
    font-family: var(--mono); font-size: 9px; line-height: 1.9; color: var(--muted);
  }
  #info b { color: #cfe6f6; font-weight: 500; }
  #info i { color: var(--cyan); font-style: normal; }

  .label {
    padding: 3px 7px; border: 1px solid rgba(140, 210, 240, .28); border-radius: 5px;
    background: rgba(5, 14, 24, .78); color: #cfe6f6;
    font-size: 10px; white-space: nowrap; letter-spacing: .04em;
    pointer-events: none;
  }
  .label.water { color: #8fd2ff; border-color: rgba(90, 180, 240, .5); }

  #loading {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: #06101a; transition: opacity .5s ease;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
  #loading .box { text-align: center; }
  #loading b { display: block; font-size: 13px; letter-spacing: .2em; margin-bottom: 10px; }
  #loading i { display: block; width: 180px; height: 2px; background: rgba(120,190,220,.16); }
  #loading i em { display: block; width: 40%; height: 100%; background: var(--cyan); animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(0); } 50% { transform: translateX(150%); } 100% { transform: translateX(0); } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/three-addons/"
  }
}
</script>
</head>
<body>
<div id="scene"></div>

<div id="head">
  <b>四川吉利学院 · 真实校园底图</b>
  <span>BUILD <em>v2</em> · OFFICIAL VECTOR TILES · 51 BUILDINGS / 160 ROADS / 8 WATER</span>
</div>

<div id="dock">
  <a class="dock-link" href="./v1/">六网完整版 ↗</a>
  <button id="btn-time" type="button">☾ 夜间</button>
  <button id="btn-reset" type="button">⟲ 复位</button>
</div>

<div id="info">
  <div>数据源 <b>map.guc.edu.cn</b> MVT 矢量瓦片</div>
  <div>建筑 <i id="stat-b">0</i> · 道路 <i id="stat-r">0</i> · 水系 <i id="stat-w">0</i></div>
  <div>拖拽旋转 · 滚轮缩放 · 右键平移</div>
</div>

<div id="loading"><div class="box"><b>正在载入真实校园矢量</b><i><em></em></i></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const container = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.8));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
container.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.style.position = 'fixed';
labelRenderer.domElement.style.inset = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
labelRenderer.domElement.style.zIndex = '4';
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x16293a);
scene.fog = new THREE.FogExp2(0x16293a, 0.00055);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 1, 6000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 40;
controls.maxDistance = 2600;

const hemi = new THREE.HemisphereLight(0x9fc6ff, 0x16241c, 0.95);
scene.add(new THREE.AmbientLight(0x35506a, 0.55));
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe6c4, 1.25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 10;
sun.shadow.camera.far = 2600;
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);

const data = await fetch('./data/campus-v2.json').then((r) => r.json());
document.getElementById('stat-b').textContent = data.buildings.length;
document.getElementById('stat-r').textContent = data.roads.length;
document.getElementById('stat-w').textContent = data.water.length;

/* ---------------- 世界边界 ---------------- */
const bounds = { minX: Infinity, maxX: -Infinity, minZ: Infinity, maxZ: -Infinity };
for (const b of data.buildings) for (const ring of b.r) for (const p of ring) {
  bounds.minX = Math.min(bounds.minX, p[0]); bounds.maxX = Math.max(bounds.maxX, p[0]);
  bounds.minZ = Math.min(bounds.minZ, p[1]); bounds.maxZ = Math.max(bounds.maxZ, p[1]);
}
const mid = { x: (bounds.minX + bounds.maxX) / 2, z: (bounds.minZ + bounds.maxZ) / 2 };
const span = Math.max(bounds.maxX - bounds.minX, bounds.maxZ - bounds.minZ);

/* ---------------- 地面 ---------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(span * 3.2, span * 3.2, 1, 1),
  new THREE.MeshStandardMaterial({ color: 0x22352a, roughness: 0.95, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.set(mid.x, -0.02, mid.z);
ground.receiveShadow = true;
scene.add(ground);

/* 草地大块（校园范围） */
const lawn = new THREE.Mesh(
  new THREE.PlaneGeometry(span * 1.02, span * 1.02),
  new THREE.MeshStandardMaterial({ color: 0x2b4126, roughness: 1 })
);
lawn.rotation.x = -Math.PI / 2;
lawn.position.set(mid.x, 0.01, mid.z);
lawn.receiveShadow = true;
scene.add(lawn);

/* ---------------- 水系 ---------------- */
const waterMat = new THREE.MeshStandardMaterial({
  color: 0x2a7fa8,
  emissive: 0x0d3b55,
  emissiveIntensity: 1.1,
  roughness: 0.15,
  metalness: 0.55,
  transparent: true,
  opacity: 0.94
});
for (const ring of data.water) {
  const shape = new THREE.Shape();
  shape.moveTo(ring[0][0], -ring[0][1]);
  for (let i = 1; i < ring.length; i++) shape.lineTo(ring[i][0], -ring[i][1]);
  shape.closePath();
  const geo = new THREE.ShapeGeometry(shape);
  geo.rotateX(-Math.PI / 2);
  const mesh = new THREE.Mesh(geo, waterMat);
  mesh.position.y = 0.09;
  scene.add(mesh);
}

/* ---------------- 道路 ---------------- */
const ROAD_W = { primary: 11, secondary: 9, tertiary: 8, living_street: 6, service: 5, path: 3, pedestrian: 3, steps: 2.4, track: 3 };
const roadMat = new THREE.MeshStandardMaterial({ color: 0x59636e, roughness: 0.8, metalness: 0.05 });
const edgeMat = new THREE.MeshBasicMaterial({ color: 0x6fb4d0, transparent: true, opacity: 0.22 });
const roadGeoms = [];
const sidewalkGeoms = [];
const edgeGeoms = [];
function ribbon(points, width, list) {
  const curve = [];
  for (const p of points) {
    const v = new THREE.Vector3(p[0], 0, p[1]);
    if (!curve.length || curve[curve.length - 1].distanceTo(v) > 0.6) curve.push(v);
  }
  if (curve.length < 2) return;
  const positions = [];
  const indices = [];
  const normals = [];
  for (let i = 0; i < curve.length; i++) {
    const prev = curve[Math.max(0, i - 1)];
    const next = curve[Math.min(curve.length - 1, i + 1)];
    const dir = new THREE.Vector3().subVectors(next, prev).normalize();
    const side = new THREE.Vector3(-dir.z, 0, dir.x).multiplyScalar(width / 2);
    positions.push(curve[i].x - side.x, 0, curve[i].z - side.z);
    positions.push(curve[i].x + side.x, 0, curve[i].z + side.z);
    normals.push(0, 1, 0, 0, 1, 0);
    if (i < curve.length - 1) {
      const a = i * 2;
      indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  g.setIndex(indices);
  list.push(g);
}
for (const road of data.roads) {
  const w = ROAD_W[road.w] || 4;
  for (const line of road.l) {
    ribbon(line, w + 4.5, sidewalkGeoms);
    ribbon(line, w, roadGeoms);
  }
}
const sidewalkMesh = new THREE.Mesh(mergeGeos(sidewalkGeoms), new THREE.MeshStandardMaterial({ color: 0x9aa3ab, roughness: 0.95 }));
sidewalkMesh.position.y = 0.025;
sidewalkMesh.receiveShadow = true;
scene.add(sidewalkMesh);
const roadMesh = new THREE.Mesh(mergeGeos(roadGeoms), roadMat);
roadMesh.position.y = 0.05;
roadMesh.receiveShadow = true;
scene.add(roadMesh);

/* 道路中心线（微亮） */
for (const road of data.roads) {
  for (const line of road.l) {
    if (line.length < 2) continue;
    const pts = line.map((p) => new THREE.Vector3(p[0], 0.075, p[1]));
    const g = new THREE.BufferGeometry().setFromPoints(pts);
    const l = new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xd8c08a, transparent: true, opacity: 0.18 }));
    scene.add(l);
  }
}

/* ---------------- 路灯与行道树 ---------------- */
const lampPoles = [];
const lampHeads = [];
const avenue = [];
for (const road of data.roads) {
  if (!['primary', 'secondary', 'tertiary'].includes(road.w)) continue;
  for (const line of road.l) {
    for (let i = 0; i < line.length - 1; i++) {
      const a = line[i], b = line[i + 1];
      const dx = b[0] - a[0], dz = b[1] - a[1];
      const len = Math.hypot(dx, dz);
      if (len < 12) continue;
      const nx = -dz / len, nz = dx / len;
      const steps = Math.floor(len / 34);
      for (let k = 0; k < steps; k++) {
        const t = (k + 0.5) / Math.max(1, steps);
        const x = a[0] + dx * t, z = a[1] + dz * t;
        const side = (k % 2 === 0) ? 1 : -1;
        lampPoles.push([x + nx * 6 * side, z + nz * 6 * side]);
        avenue.push([x + nx * 9 * side, z + nz * 9 * side]);
      }
    }
  }
}
if (lampPoles.length) {
  const poleGeo = new THREE.CylinderGeometry(0.12, 0.16, 7, 6);
  poleGeo.translate(0, 3.5, 0);
  const headGeo = new THREE.SphereGeometry(0.34, 8, 8);
  headGeo.translate(0, 7.1, 0);
  const poleMesh = new THREE.InstancedMesh(poleGeo, new THREE.MeshStandardMaterial({ color: 0x3a444d, roughness: 0.8 }), lampPoles.length);
  const headMesh = new THREE.InstancedMesh(headGeo, new THREE.MeshBasicMaterial({ color: 0xffd9a0 }), lampPoles.length);
  const m4 = new THREE.Matrix4();
  for (let i = 0; i < lampPoles.length; i++) {
    m4.makeTranslation(lampPoles[i][0], 0, lampPoles[i][1]);
    poleMesh.setMatrixAt(i, m4);
    headMesh.setMatrixAt(i, m4);
  }
  scene.add(poleMesh, headMesh);
}

/* ---------------- 树木（真实点位） ---------------- */
const treeData = (data.trees || []).concat(avenue);
if (treeData.length) {
  const trunkGeo = new THREE.CylinderGeometry(0.22, 0.32, 3.2, 6);
  trunkGeo.translate(0, 1.6, 0);
  const crownGeo = new THREE.IcosahedronGeometry(2.2, 1);
  crownGeo.translate(0, 5.4, 0);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4b3a2a, roughness: 0.95 });
  const crownMat = new THREE.MeshStandardMaterial({ color: 0x3f6a3a, roughness: 0.9, flatShading: true });
  const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, treeData.length);
  const crowns = new THREE.InstancedMesh(crownGeo, crownMat, treeData.length);
  const m4 = new THREE.Matrix4();
  const color = new THREE.Color();
  for (let i = 0; i < treeData.length; i++) {
    const t = treeData[i];
    const sc = 0.8 + (i % 7) * 0.06;
    m4.makeScale(sc, sc * (0.9 + (i % 5) * 0.05), sc);
    m4.setPosition(t[0], 0, t[1]);
    trunks.setMatrixAt(i, m4);
    crowns.setMatrixAt(i, m4);
    color.setHSL(0.26 + (i % 5) * 0.01, 0.32, 0.32 + (i % 4) * 0.03);
    crowns.setColorAt(i, color);
  }
  trunks.castShadow = true;
  crowns.castShadow = true;
  scene.add(trunks, crowns);
}

/* ---------------- 建筑 ---------------- */
const WINDOW_UNIFORMS = { uNight: { value: 1 } };
function makeBuildingMaterial(baseColor) {
  const mat = new THREE.MeshStandardMaterial({ color: baseColor, roughness: 0.72, metalness: 0.12 });
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uNight = WINDOW_UNIFORMS.uNight;
    shader.vertexShader = 'varying vec3 vWPos;\nvarying vec3 vWN;\n' + shader.vertexShader.replace(
      '#include <worldpos_vertex>',
      `#include <worldpos_vertex>
       vWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
       vWN = normalize(mat3(modelMatrix) * objectNormal);`
    );
    shader.fragmentShader = 'varying vec3 vWPos;\nvarying vec3 vWN;\nuniform float uNight;\n' + shader.fragmentShader.replace(
      '#include <dithering_fragment>',
      `#include <dithering_fragment>
       float wall = 1.0 - smoothstep(0.45, 0.62, abs(vWN.y));
       float fy = fract((vWPos.y - 1.2) / 3.6);
       float fx = fract((vWPos.x + vWPos.z) / 4.2);
       float win = step(0.52, fx) * step(fx, 0.88) * step(0.30, fy) * step(fy, 0.78);
       vec3 winCol = vec3(1.0, 0.82, 0.55) * (0.35 + 0.65 * uNight);
       gl_FragColor.rgb = mix(gl_FragColor.rgb, winCol, win * wall * 0.85);
       float band = smoothstep(0.86, 1.0, fract(vWPos.y / 3.6));
       gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(0.86, 0.88, 0.9), band * wall * 0.55);`
    );
  };
  return mat;
}
const palette = [0xc2ccd6, 0xd0d8df, 0xb6c1cb, 0xdadfe4, 0xaab6c2];
const KIND_COLOR = { library: 0xdde6ec, teaching: 0xe4e8ec, student_bedroom: 0xd8cdb9, gymnasium: 0xd2dae0, canteen: 0xdccdb8, experiment_building: 0xccd7df, administration: 0xe0dacd, service_building: 0xd6d0c7, hospital: 0xe2e5e8 };
const buildingGeoms = [];
let idx = 0;
for (const b of data.buildings) {
  if (b.n === '运动场') continue;
  const ring = b.r[0];
  if (!ring || ring.length < 3) continue;
  const shape = new THREE.Shape();
  shape.moveTo(ring[0][0], -ring[0][1]);
  for (let i = 1; i < ring.length; i++) shape.lineTo(ring[i][0], -ring[i][1]);
  shape.closePath();
  const h = Math.max(4, b.h || 12);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false, curveSegments: 1 });
  geo.rotateX(-Math.PI / 2);
  geo.translate(0, 0, 0);
  // 颜色写入顶点色
  const color = new THREE.Color(KIND_COLOR[b.k] || palette[idx % palette.length]);
  const count = geo.attributes.position.count;
  const colors = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) { colors[i * 3] = color.r; colors[i * 3 + 1] = color.g; colors[i * 3 + 2] = color.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  buildingGeoms.push(geo);
  idx++;
}
const bMat = makeBuildingMaterial(0xffffff);
bMat.vertexColors = true;
const buildingMesh = new THREE.Mesh(mergeGeos(buildingGeoms), bMat);
buildingMesh.castShadow = true;
buildingMesh.receiveShadow = true;
scene.add(buildingMesh);

/* 屋顶（深色薄板） */
const roofGeos = [];
for (const b of data.buildings) {
  if (b.n === '运动场') continue;
  const ring = b.r[0];
  if (!ring || ring.length < 3) continue;
  const shape = new THREE.Shape();
  shape.moveTo(ring[0][0], -ring[0][1]);
  for (let i = 1; i < ring.length; i++) shape.lineTo(ring[i][0], -ring[i][1]);
  shape.closePath();
  const geo = new THREE.ShapeGeometry(shape);
  geo.rotateX(-Math.PI / 2);
  geo.translate(0, Math.max(4, b.h || 12) + 0.06, 0);
  roofGeos.push(geo);
}
const roofMesh = new THREE.Mesh(mergeGeos(roofGeos), new THREE.MeshStandardMaterial({ color: 0x3a4450, roughness: 0.9 }));
scene.add(roofMesh);

/* ---------------- 操场 / 篮球场 / 网球场 ---------------- */
// ① 操场：跑道西侧的大场地
function lineStrip(w, d, x, z, rot, color = 0xe8eef2) {
  const mat = new THREE.MeshBasicMaterial({ color });
  const geo = new THREE.PlaneGeometry(w, d);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.rotation.z = rot;
  mesh.position.set(x, 0.095, z);
  scene.add(mesh);
  return mesh;
}
// ② 篮球场：4 片，2x2，带篮架
const basketMat = new THREE.MeshStandardMaterial({ color: 0x3e6f8f, roughness: 0.9 });
for (let i = 0; i < 4; i++) {
  const cx = 12 - (i % 2) * 30;
  const cz = -288 - Math.floor(i / 2) * 26;
  const court = new THREE.Mesh(new THREE.PlaneGeometry(26, 14), basketMat);
  court.rotation.x = -Math.PI / 2;
  court.rotation.z = -0.05;
  court.position.set(cx, 0.085, cz);
  scene.add(court);
  lineStrip(24, 0.4, cx, cz + 5.6, -0.05);
  lineStrip(24, 0.4, cx, cz - 5.6, -0.05);
  lineStrip(0.4, 14, cx - 13, cz, -0.05);
  lineStrip(0.4, 14, cx + 13, cz, -0.05);
  // 篮架
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 3.2, 6), new THREE.MeshStandardMaterial({ color: 0x4a545c }));
  pole.position.set(cx - 12.4, 1.6, cz);
  scene.add(pole);
  const board = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 1.1), new THREE.MeshStandardMaterial({ color: 0xe6ebef, side: THREE.DoubleSide }));
  board.position.set(cx - 11.5, 2.9, cz);
  board.rotation.y = Math.PI / 2;
  scene.add(board);
}

// ③ 网球场：2 片
for (let i = 0; i < 2; i++) {
  const cx = 58;
  const cz = -258 - i * 22;
  const court = new THREE.Mesh(new THREE.PlaneGeometry(24, 11), new THREE.MeshStandardMaterial({ color: 0x3f7a55, roughness: 0.9 }));
  court.rotation.x = -Math.PI / 2;
  court.rotation.z = -0.05;
  court.position.set(cx, 0.085, cz);
  scene.add(court);
  lineStrip(22, 0.35, cx, cz + 4.4, -0.05);
  lineStrip(22, 0.35, cx, cz - 4.4, -0.05);
  lineStrip(0.35, 11, cx - 11, cz, -0.05);
  lineStrip(0.35, 11, cx + 11, cz, -0.05);
  lineStrip(0.35, 11, cx, cz, -0.05);
  const net = new THREE.Mesh(new THREE.PlaneGeometry(0.1, 8.8), new THREE.MeshBasicMaterial({ color: 0xdfe7ec, transparent: true, opacity: 0.6, side: THREE.DoubleSide }));
  net.rotation.y = Math.PI / 2;
  net.position.set(cx, 0.6, cz);
  scene.add(net);
}

/* ---------------- 校门与运动场 ---------------- */
function makeSignTexture(text) {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 192;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#f6f2e8';
  ctx.font = 'bold 96px "Microsoft YaHei", "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, c.width / 2, c.height / 2);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  return tex;
}
const gateDefs = [
  { name: '南门', x: 204.7, z: 442.1, rot: 0, main: true },
  { name: '西南门', x: -294.7, z: 254.4, rot: Math.PI / 2, main: false },

/* 西侧运动场与篮球场 */
function ellipseField(cx, cz, rx, rz, color, y) {
  const shape = new THREE.Shape();
  shape.absellipse(0, 0, rx, rz, 0, Math.PI * 2, false, 0);
  const geo = new THREE.ShapeGeometry(shape, 48);
  geo.rotateX(-Math.PI / 2);
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, roughness: 0.92 }));
  mesh.position.set(cx, y, cz);
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}
ellipseField(-88, -222, 54, 99, 0x9d4b3f, 0.1);
ellipseField(-88, -222, 36, 79, 0x2f6b3a, 0.14);
for (const [text, x, z] of [['运动场', -88, -222], ['篮球场', 12, -288], ['网球场', 58, -258]]) {
  const el = document.createElement('div');
  el.className = 'label';
  el.textContent = text;
  const obj = new CSS2DObject(el);
  obj.position.set(x, 10, z);
  scene.add(obj);
}

const stadium = data.buildings.find((b) => b.n === '运动场');
if (stadium && stadium.r[0]) {
  const ring = stadium.r[0];
  const cx = ring.reduce((a, p) => a + p[0], 0) / ring.length;
  const cz = ring.reduce((a, p) => a + p[1], 0) / ring.length;
  function scaledShape(scale) {
    const shape = new THREE.Shape();
    ring.forEach((p, i) => {
      const x = cx + (p[0] - cx) * scale;
      const z = cz + (p[1] - cz) * scale;
      if (i === 0) shape.moveTo(x, -z); else shape.lineTo(x, -z);
    });
    shape.closePath();
    const geo = new THREE.ShapeGeometry(shape);
    geo.rotateX(-Math.PI / 2);
    geo.translate(0, 0.12, 0);
    return geo;
  }
  const trackMesh = new THREE.Mesh(scaledShape(0.8), new THREE.MeshStandardMaterial({ color: 0x9d4b3f, roughness: 0.9 }));
  const fieldMesh = new THREE.Mesh(scaledShape(0.56), new THREE.MeshStandardMaterial({ color: 0x2f6b3a, roughness: 0.95 }));
  trackMesh.receiveShadow = true;
  fieldMesh.receiveShadow = true;
  scene.add(trackMesh, fieldMesh);
}

/* ---------------- 重点立面 ---------------- */
function signTexture(text) {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 192;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#f5efe4';
  ctx.font = 'bold 96px "Microsoft YaHei", "PingFang SC", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 512, 96);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4; return tex;
}
const lib = data.buildings.find((b) => b.n === '图书馆');
if (lib) {
  const ring = lib.r[0];
  const xs = ring.map((p) => p[0]), zs = ring.map((p) => p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), maxZ = Math.max(...zs);
  const cx = (minX + maxX) / 2;
  const w = Math.min(26, (maxX - minX) * 0.34);
  const h = Math.min(26, lib.h * 0.5);
  const panel = new THREE.Mesh(new THREE.BoxGeometry(w, h, 1.2), new THREE.MeshStandardMaterial({ color: 0x8a4a3a, roughness: 0.85 }));
  panel.position.set(cx, lib.h * 0.5, maxZ + 0.5);
  scene.add(panel);
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.7, w * 0.18), new THREE.MeshBasicMaterial({ map: signTexture('图书馆'), transparent: true, alphaTest: 0.05 }));
  sign.position.set(cx, lib.h * 0.62, maxZ + 1.15);
  scene.add(sign);
  for (let i = 0; i < 8; i++) {
    const louver = new THREE.Mesh(new THREE.BoxGeometry(maxX - minX + 2, 0.35, 0.5), new THREE.MeshStandardMaterial({ color: 0xdde3e8, roughness: 0.6 }));
    louver.position.set(cx, 4 + i * ((lib.h - 8) / 7), maxZ + 0.2);
    scene.add(louver);
  }
}
for (const name of ['体育馆', '游泳馆']) {
  const b = data.buildings.find((x) => x.n === name);
  if (!b) continue;
  const ring = b.r[0];
  const xs = ring.map((p) => p[0]), zs = ring.map((p) => p[1]);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2;
  const cz = (Math.min(...zs) + Math.max(...zs)) / 2;
  const r = Math.min((Math.max(...xs) - Math.min(...xs)) / 2, (Math.max(...zs) - Math.min(...zs)) / 2) * 0.55;
  const dome = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0xd6dde3, roughness: 0.45, metalness: 0.25 }));
  dome.scale.y = 0.3;
  dome.position.set(cx, b.h * 0.8, cz);
  dome.castShadow = true;
  scene.add(dome);
}

/* ---------------- 广场铺装 ---------------- */

/* ---------------- 湖岸线 ---------------- */
const bankMat = new THREE.MeshStandardMaterial({ color: 0xb9c2b4, roughness: 1 });
for (const ring of data.water) {
  const cx = ring.reduce((a, p) => a + p[0], 0) / ring.length;
  const cz = ring.reduce((a, p) => a + p[1], 0) / ring.length;
  const shape = new THREE.Shape();
  ring.forEach((p, i) => {

  shape.closePath();
  const geo = new THREE.ShapeGeometry(shape);
  geo.rotateX(-Math.PI / 2);
  const mesh = new THREE.Mesh(geo, bankMat);
  mesh.position.y = 0.045;
  scene.add(mesh);
}

/* ---------------- 标签 ---------------- */
const MAJOR = /图书馆|行政楼|体育馆|游泳馆|运动场|双创|食堂|医院|国际交流|学生活动中心|南门|北门|东门|西南门/;
for (const b of data.buildings) {

controls.addEventListener('start', () => { controls.autoRotate = false; });

/* ---------------- 渲染 ---------------- */
function mergeGeos(list) {
  let total = 0;
  const nonIndexed = list.map((g) => (g.index ? g.toNonIndexed() : g));
  for (const g of nonIndexed) total += g.attributes.position.count;
  const pos = new Float32Array(total * 3);
  const nor = new Float32Array(total * 3);
  const col = new Float32Array(total * 3);
  let i = 0;
  let hasColor = nonIndexed.every((g) => g.attributes.color);
  for (const g of nonIndexed) {
    pos.set(g.attributes.position.array, i * 3);
    if (g.attributes.normal) nor.set(g.attributes.normal.array, i * 3);
    if (hasColor) col.set(g.attributes.color.array, i * 3);
    i += g.attributes.position.count;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  if (hasColor) geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return geo;
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  controls.update(dt);
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
animate();
document.getElementById('loading').classList.add('hide');
