<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#04070d" />
<title>四川吉利学院 · 校园数字孪生 | Campus Digital Twin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23081018'/%3E%3Ctext x='50' y='70' font-size='56' text-anchor='middle' fill='%2338e1ff' font-family='sans-serif'%3E%E5%90%89%3C/text%3E%3C/svg%3E" />
<style>
  /* =====================================================================
     0. 设计变量与基础
     ===================================================================== */
  :root {
    --bg: #04070d;
    --bg-2: #070d17;
    --panel: rgba(7, 13, 23, .78);
    --panel-solid: #0a1320;
    --line: rgba(110, 190, 255, .13);
    --line-2: rgba(110, 190, 255, .3);
    --text: #dbe8f6;
    --muted: #8aa0b8;
    --dim: #4e647c;
    --cyan: #38e1ff;
    --blue: #4c8dff;
    --amber: #ffb648;
    --red: #ff5c6c;
    --green: #3ee08f;
    --purple: #a78bfa;
    --pink: #f472b6;
    --water: #38bdf8;
    --power: #ffb648;
    --compute: #a78bfa;
    --comms: #3ee08f;
    --tunnel: #f472b6;
    --logistics: #ff8a4c;
    --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --sans: "Inter", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  #scene {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  #scene canvas {
    display: block;
    width: 100%;
    height: 100%;
    outline: none;
  }

  /* 屏幕暗角 + 扫描线，压出指挥中心质感 */
  #vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 46%, transparent 42%, rgba(2, 5, 10, .55) 100%),
      linear-gradient(180deg, rgba(3, 7, 14, .5) 0%, transparent 16%, transparent 78%, rgba(2, 5, 11, .68) 100%);
  }

  #vignette::after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .16;
    background: repeating-linear-gradient(180deg, rgba(140, 210, 255, .08) 0 1px, transparent 1px 3px);
    mix-blend-mode: screen;
  }

  .mono { font-family: var(--mono); }

  /* =====================================================================
     1. 顶部栏
     ===================================================================== */
  #topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 18px;
    height: 62px;
    padding: 0 18px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(5, 10, 18, .94), rgba(5, 10, 18, .72));
    backdrop-filter: blur(14px);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    min-width: 0;
  }

  .brand-mark {
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    flex: 0 0 auto;
    border: 1px solid rgba(56, 225, 255, .45);
    border-radius: 9px;
    background:
      linear-gradient(135deg, rgba(56, 225, 255, .26), rgba(76, 141, 255, .08));
    box-shadow: 0 0 22px rgba(56, 225, 255, .22), inset 0 0 14px rgba(56, 225, 255, .12);
    color: #d9f8ff;
    font-size: 17px;
    font-weight: 800;
  }

  .brand-copy h1 {
    margin: 0;
    overflow: hidden;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .04em;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .brand-copy p {
    margin: 3px 0 0;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 8px;
    letter-spacing: .18em;
    white-space: nowrap;
  }

  .topstats {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-left: 8px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 24px;
    padding: 0 9px;
    border: 1px solid var(--line);
    border-radius: 99px;
    background: rgba(12, 22, 36, .7);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .06em;
    white-space: nowrap;
  }

  .chip .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px rgba(62, 224, 143, .9);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: .45; }
    50% { opacity: 1; }
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
  }

  .tb-btn {
    height: 30px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: rgba(12, 22, 36, .72);
    color: #b7c9dc;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .04em;
    white-space: nowrap;
    transition: border-color .16s ease, background .16s ease, color .16s ease;
  }

  .tb-btn:hover {
    border-color: var(--line-2);
    background: rgba(28, 52, 76, .72);
    color: #eaf7ff;
  }

  .tb-btn.is-on {
    border-color: rgba(56, 225, 255, .5);
    background: rgba(56, 225, 255, .14);
    color: #c9f6ff;
    box-shadow: 0 0 16px rgba(56, 225, 255, .16);
  }

  /* =====================================================================
     2. 通用面板
     ===================================================================== */
  .panel {
    position: fixed;
    top: 74px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 236px);
    border: 1px solid var(--line);
    border-radius: 12px;
    background:
      linear-gradient(180deg, rgba(10, 18, 30, .9), rgba(6, 11, 20, .86));
    box-shadow: 0 24px 60px rgba(0, 0, 0, .42), inset 0 1px 0 rgba(160, 220, 255, .05);
    backdrop-filter: blur(16px);
    overflow: hidden;
  }

  .panel::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 34px;
    height: 1px;
    background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan);
  }

  .panel-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 13px 9px;
    border-bottom: 1px solid var(--line);
  }

  .panel-head h2 {
    margin: 0;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .06em;
  }

  .panel-head p {
    margin: 4px 0 0;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 7.5px;
    letter-spacing: .14em;
  }

  .panel-index {
    color: var(--dim);
    font-family: var(--mono);
    font-size: 9px;
  }

  #layer-panel {
    left: 16px;
    width: 238px;
  }

  #detail-panel {
    right: 16px;
    width: 356px;
  }

  .layer-list {
    display: flex;
    flex-direction: column;
    padding: 6px 6px 8px;
    overflow-y: auto;
  }

  .layer-row {
    display: grid;
    grid-template-columns: 14px 1fr auto;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 8px 7px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: #b6c8da;
    font-size: 11px;
    text-align: left;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }

  .layer-row + .layer-row { margin-top: 2px; }

  .layer-row:hover {
    background: rgba(56, 225, 255, .06);
    color: #eaf7ff;
  }

  .layer-row.is-active {
    border-color: rgba(56, 225, 255, .34);
    background: rgba(56, 225, 255, .1);
    color: #e8fbff;
  }

  .layer-row.is-off {
    color: #54697f;
  }

  .layer-row.is-off .swatch {
    opacity: .28;
    box-shadow: none;
  }

  .swatch {
    width: 9px;
    height: 9px;
    border-radius: 3px;
    background: var(--c, var(--cyan));
    box-shadow: 0 0 9px var(--c, var(--cyan));
  }

  .layer-name {
    display: flex;
    align-items: baseline;
    gap: 6px;
    min-width: 0;
  }

  .layer-name b {
    overflow: hidden;
    font-size: 11px;
    font-weight: 600;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .layer-name span {
    color: var(--dim);
    font-family: var(--mono);
    font-size: 7px;
    letter-spacing: .08em;
    white-space: nowrap;
  }

  .layer-meta {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .layer-count {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 8px;
  }

  .layer-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--c, var(--cyan));
    opacity: .9;
  }

  .panel-split {
    height: 1px;
    margin: 2px 12px;
    background: var(--line);
  }

  .layer-sub {
    padding: 8px 13px 2px;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 7.5px;
    letter-spacing: .16em;
    text-transform: uppercase;
  }

  .scene-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 1px 6px;
    padding: 7px 7px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: #93a8bd;
    font-size: 10px;
    text-align: left;
  }

  .scene-toggle:hover {
    background: rgba(255, 255, 255, .04);
    color: #e6f4ff;
  }

  .switch {
    position: relative;
    width: 26px;
    height: 14px;
    flex: 0 0 auto;
    border: 1px solid rgba(120, 180, 220, .3);
    border-radius: 99px;
    background: rgba(20, 34, 50, .9);
    transition: background .18s ease, border-color .18s ease;
  }

  .switch::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #6d859c;
    transition: transform .18s ease, background .18s ease;
  }

  .scene-toggle.is-on .switch {
    border-color: rgba(56, 225, 255, .55);
    background: rgba(56, 225, 255, .22);
  }

  .scene-toggle.is-on .switch::after {
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
    transform: translateX(12px);
  }

  .scene-toggle.is-on { color: #d9f4ff; }

  /* =====================================================================
     3. 右侧总览 / 详情
     ===================================================================== */
  #detail-view {
    flex: 1;
    min-height: 0;
    padding: 11px 13px 13px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(56, 225, 255, .26) transparent;
  }

  #detail-view::-webkit-scrollbar { width: 5px; }
  #detail-view::-webkit-scrollbar-thumb { border-radius: 99px; background: rgba(56, 225, 255, .24); }

  .ov-title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 9px;
  }

  .ov-title h3 {
    margin: 0;
    font-size: 13px;
    font-weight: 700;
  }

  .ov-title span {
    color: var(--dim);
    font-family: var(--mono);
    font-size: 8px;
  }

  .hero-score {
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 10px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background:
      radial-gradient(circle at 100% 0, rgba(56, 225, 255, .14), transparent 55%),
      rgba(8, 16, 27, .7);
  }

  .hero-score .value {
    font-family: var(--mono);
    font-size: 34px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -.02em;
  }

  .hero-score .value small {
    color: var(--dim);
    font-size: 11px;
    font-weight: 500;
  }

  .hero-score .label {
    margin-top: 5px;
    color: var(--muted);
    font-size: 9px;
  }

  .hero-score .side {
    text-align: right;
  }

  .hero-score .side b {
    display: block;
    font-family: var(--mono);
    font-size: 12px;
  }

  .hero-score .side span {
    color: var(--dim);
    font-family: var(--mono);
    font-size: 7.5px;
    letter-spacing: .1em;
  }

  .kpi-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 8px;
  }

  .kpi {
    padding: 8px 9px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: rgba(8, 15, 26, .58);
  }

  .kpi span {
    display: block;
    color: var(--dim);
    font-size: 8px;
    letter-spacing: .04em;
  }

  .kpi b {
    display: block;
    margin-top: 3px;
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
  }

  .kpi b em {
    margin-left: 3px;
    color: var(--dim);
    font-size: 8px;
    font-style: normal;
    font-weight: 400;
  }

  .kpi.warn { border-color: rgba(255, 92, 108, .35); background: rgba(255, 92, 108, .06); }
  .kpi.warn b { color: var(--red); }

  .net-mini-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-top: 10px;
  }

  .net-mini {
    display: grid;
    grid-template-columns: 34px 1fr 40px;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 6px 7px;
    border: 1px solid transparent;
    border-radius: 7px;
    background: transparent;
    color: #b9cbdd;
    font-size: 10px;
    text-align: left;
  }

  .net-mini:hover {
    border-color: var(--line);
    background: rgba(255, 255, 255, .03);
  }

  .net-mini b {
    color: var(--c, var(--cyan));
    font-weight: 600;
  }

  .mini-bar {
    position: relative;
    height: 4px;
    overflow: hidden;
    border-radius: 99px;
    background: rgba(120, 170, 210, .12);
  }

  .mini-bar i {
    position: absolute;
    inset: 0 auto 0 0;
    width: var(--w, 40%);
    border-radius: 99px;
    background: var(--c, var(--cyan));
    box-shadow: 0 0 8px var(--c, var(--cyan));
    transition: width .5s ease;
  }

  .net-mini em {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 8px;
    font-style: normal;
    text-align: right;
  }

  .section-label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 12px 0 6px;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 7.5px;
    letter-spacing: .16em;
    text-transform: uppercase;
  }

  .section-label i {
    flex: 1;
    height: 1px;
    margin-left: 0;
    background: var(--line);
  }

  .alert-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .alert-row {
    display: flex;
    align-items: flex-start;
    gap: 7px;
    padding: 7px 8px;
    border: 1px solid rgba(255, 182, 72, .22);
    border-radius: 7px;
    background: rgba(255, 182, 72, .05);
    color: #d9c9a8;
    font-size: 9.5px;
    line-height: 1.5;
  }

  .alert-row.crit {
    border-color: rgba(255, 92, 108, .3);
    background: rgba(255, 92, 108, .06);
    color: #ffc7cd;
  }

  .alert-row .tag {
    flex: 0 0 auto;
    padding: 1px 4px;
    border-radius: 3px;
    background: rgba(255, 182, 72, .18);
    color: var(--amber);
    font-family: var(--mono);
    font-size: 7px;
  }

  .alert-row.crit .tag {
    background: rgba(255, 92, 108, .18);
    color: var(--red);
  }

  /* 详情 */
  .detail-head {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    margin-bottom: 10px;
  }

  .back-btn {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: rgba(12, 22, 36, .7);
    color: var(--muted);
    font-size: 12px;
  }

  .back-btn:hover { color: #fff; border-color: var(--line-2); }

  .detail-head h3 {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
  }

  .detail-head p {
    margin: 3px 0 0;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 7.5px;
    letter-spacing: .12em;
  }

  .status-pill {
    margin-left: auto;
    padding: 3px 7px;
    border: 1px solid rgba(62, 224, 143, .3);
    border-radius: 99px;
    background: rgba(62, 224, 143, .08);
    color: var(--green);
    font-family: var(--mono);
    font-size: 8px;
    white-space: nowrap;
  }

  .status-pill.warn { border-color: rgba(255, 182, 72, .35); background: rgba(255, 182, 72, .09); color: var(--amber); }
  .status-pill.crit { border-color: rgba(255, 92, 108, .4); background: rgba(255, 92, 108, .1); color: var(--red); }

  .spark-wrap {
    margin-top: 8px;
    padding: 8px 9px 5px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: rgba(6, 13, 23, .62);
  }

  .spark-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 7.5px;
    letter-spacing: .1em;
  }

  .spark-head b {
    color: var(--c, var(--cyan));
    font-size: 9px;
  }

  #spark-canvas {
    display: block;
    width: 100%;
    height: 74px;
    margin-top: 3px;
  }

  .fac-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .fac-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px;
    padding: 6px 7px;
    border: 1px solid transparent;
    border-radius: 7px;
    background: rgba(255, 255, 255, .018);
    cursor: pointer;
  }

  .fac-row:hover { border-color: var(--line); background: rgba(255, 255, 255, .04); }
  .fac-row.is-active { border-color: var(--line-2); background: rgba(56, 225, 255, .08); }

  .fac-name {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    font-size: 10px;
    color: #c6d7e8;
  }

  .fac-name i {
    width: 5px;
    height: 5px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: var(--green);
  }

  .fac-name i.warn { background: var(--amber); }
  .fac-name i.crit { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .fac-name i.off { background: #465a70; }

  .fac-name span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .fac-val {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 8.5px;
  }

  .incident-box {
    margin-top: 10px;
    padding: 10px;
    border: 1px dashed rgba(255, 92, 108, .34);
    border-radius: 9px;
    background: linear-gradient(180deg, rgba(255, 92, 108, .07), rgba(255, 92, 108, .02));
  }

  .incident-box h4 {
    margin: 0;
    color: #ffc5cb;
    font-size: 10.5px;
    font-weight: 600;
  }

  .incident-box p {
    margin: 4px 0 8px;
    color: #a98d92;
    font-size: 8.5px;
    line-height: 1.6;
  }

  .incident-btn {
    width: 100%;
    height: 30px;
    border: 1px solid rgba(255, 92, 108, .4);
    border-radius: 7px;
    background: rgba(255, 92, 108, .12);
    color: #ffd2d6;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .06em;
    transition: background .16s ease;
  }

  .incident-btn:hover { background: rgba(255, 92, 108, .24); }
  .incident-btn:disabled { opacity: .5; cursor: default; }

  .incident-progress {
    height: 3px;
    margin-top: 7px;
    overflow: hidden;
    border-radius: 99px;
    background: rgba(255, 255, 255, .08);
  }

  .incident-progress i {
    display: block;
    width: 0;
    height: 100%;
    border-radius: 99px;
    background: var(--red);
    box-shadow: 0 0 8px var(--red);
    transition: width .25s linear;
  }

  /* =====================================================================
     4. 底部：流速 + 日志
     ===================================================================== */
  #bottombar {
    position: fixed;
    left: 16px;

      var loading = document.getElementById('loading');

      loading.classList.remove('is-done');

    }
    window.addEventListener('error', function (event) {
      if (event.target && event.target.tagName === 'SCRIPT') fail('脚本或依赖加载失败');
    }, true);
    window.addEventListener('unhandledrejection', function (event) {
      fail(event.reason && event.reason.message ? event.reason.message : event.reason);

/* ---------------------------- 纹理工具 ---------------------------- */
function makeGlowTexture(rgb = '190,240,255') {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grad.addColorStop(0, `rgba(${rgb},1)`);
  grad.addColorStop(0.28, `rgba(${rgb},.55)`);
  grad.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

function makeGridTexture() {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#6f7f8d';
  ctx.fillRect(0, 0, size, size);
  ctx.strokeStyle = 'rgba(200,232,255,.3)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= size; i += 32) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i, size);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i);
    ctx.lineTo(size, i);
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(210,242,255,.5)';
  ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, size, size);
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(26, 26);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = 8;
  return texture;
}

function makeSignTexture(title, subtitle) {
  const canvas = document.createElement('canvas');
  canvas.width = 1024;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#081522';
  ctx.fillRect(0, 0, 1024, 256);
  ctx.strokeStyle = 'rgba(56,225,255,.55)';
  ctx.lineWidth = 6;
  ctx.strokeRect(8, 8, 1008, 240);
  ctx.fillStyle = '#e8fbff';
  ctx.font = '700 96px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(title, 512, 116);
  ctx.fillStyle = '#63b8d8';
  ctx.font = '500 30px monospace';
  ctx.fillText(subtitle, 512, 196);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

const windowUniforms = { night: { value: 1 } };

buildingMat.onBeforeCompile = (shader) => {
  shader.uniforms.uNight = windowUniforms.night;
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;\nvarying vec3 vWNormal;')
    .replace('#include <begin_vertex>', '#include <begin_vertex>\nvWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;\nvWNormal = normalize(mat3(modelMatrix) * objectNormal);');
  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;\nvarying vec3 vWNormal;\nuniform float uNight;')
    .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      if (abs(vWNormal.y) < 0.4) {
        vec2 face = abs(vWNormal.x) > 0.5 ? vec2(vWPos.z, vWPos.y) : vec2(vWPos.x, vWPos.y);
        vec2 cell = vec2(2.25, 2.65);
        vec2 id = floor(face / cell);
        vec2 f = fract(face / cell);
        float win = step(0.3, f.x) * step(f.x, 0.7) * step(0.3, f.y) * step(f.y, 0.72);
        float h = fract(sin(dot(id, vec2(127.1, 311.7))) * 43758.5453);
        float lit = step(0.46, h);
        float warmPick = step(0.62, fract(h * 5.73));
        vec3 tint = mix(vec3(1.0, 0.78, 0.46), vec3(0.58, 0.84, 1.0), warmPick);
        float band = 1.0 - step(0.92, fract(vWPos.y / 3.6)) * 0.65;
        totalEmissiveRadiance += tint * win * lit * band * 0.62 * uNight;
      }
    `);
};
buildingMat.customProgramCacheKey = () => 'twin-window-v1';

function rng(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return () => {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

function pushColored(list, geometry, colorHex) {
  const count = geometry.attributes.position.count;
  const colors = new Float32Array(count * 3);
  const color = new THREE.Color(colorHex);
  for (let i = 0; i < count; i++) {
    colors[i * 3] = color.r;
    colors[i * 3 + 1] = color.g;
    colors[i * 3 + 2] = color.b;
  }
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  list.push(geometry);
}

const _brightenColor = new THREE.Color();

function brightenHex(hex, factor) {
  _brightenColor.setHex(hex).multiplyScalar(factor);
  return _brightenColor.getHex();
}

function boxAt(w, h, d, x, y, z, list, colorHex = 0x1a2433, rotY = 0) {
  const geometry = new THREE.BoxGeometry(w, h, d);
  if (rotY) geometry.rotateY(rotY);
  geometry.translate(x, y + h / 2, z);
  if (colorHex === null) list.push(geometry);
  else pushColored(list, geometry, list === geoBuilding ? brightenHex(colorHex, 1.7) : colorHex);
  return geometry;
}

function planeAt(w, d, x, y, z, list, colorHex = 0x0e151e, rotY = 0) {
  const geometry = new THREE.PlaneGeometry(w, d);
  geometry.rotateX(-Math.PI / 2);
  if (rotY) geometry.rotateY(rotY);
  geometry.translate(x, y, z);
  if (colorHex === null) list.push(geometry);
  else pushColored(list, geometry, colorHex);
  return geometry;
}

function addBeacon(x, y, z, scale = 0.16) {
  const geometry = new THREE.SphereGeometry(scale, 8, 8);
  geometry.translate(x, y, z);
  geoBeacon.push(geometry);
}

function buildBlock(block, cx, cz, i, j, random) {
  planeAt(12.6, 12.6, cx, 0.04, cz, geoPlaza, 0x111a25);
  // 地块轮廓：让 8×8 街区在夜景里保持可读
  boxAt(12.7, 0.05, 0.1, cx, 0.055, cz - 6.32, geoMark, 0x1d4c60);
  boxAt(12.7, 0.05, 0.1, cx, 0.055, cz + 6.32, geoMark, 0x1d4c60);
  boxAt(0.1, 0.05, 12.7, cx - 6.32, 0.055, cz, geoMark, 0x1d4c60);
  boxAt(0.1, 0.05, 12.7, cx + 6.32, 0.055, cz, geoMark, 0x1d4c60);

  switch (block.kind) {
    case 'green':
      addLawn(cx, cz, 11.2);
      scatterTrees(cx, cz, 3 + Math.floor(random() * 3), random);
      break;
    case 'plaza':
      addPlaza(cx, cz, 11.8);
      if (i === 3 && j === 3) {
        const basin = new THREE.CylinderGeometry(1.6, 1.8, 0.5, 18);
        basin.translate(0, 0.3, cz);
        pushColored(geoTrim, basin, 0x21404e);
        const water = new THREE.CylinderGeometry(1.35, 1.35, 0.12, 18);
        water.translate(0, 0.6, cz);
        pushColored(geoPlaza, water, 0x0b2b3d);
      }
      scatterTrees(cx, cz, 2, random, 4.8);
      break;
    case 'lake':
      addLake(cx, cz);
      break;
    case 'track':
      addTrack(cx, cz);
      break;
    case 'courts':
      addCourts(cx, cz);
      break;
    case 'parking':
      addParking(cx, cz, random);
      break;
    default: {
      addLawn(cx, cz, 11.0);
      switch (block.kind) {
        case 'teaching': addTeaching(cx, cz, block.h || 14, block.style); break;
        case 'lab': addLab(cx, cz, block.h || 12); break;
        case 'library': addLibrary(cx, cz); break;
        case 'hangar': addHangar(cx, cz, block.h || 10); break;
        case 'hall': addHall(cx, cz, block.h || 9, block.style); break;
        case 'utility': addUtility(cx, cz); break;
        case 'office': addOffice(cx, cz, block.h || 12); break;
        case 'dorm': addDorm(cx, cz); break;
        case 'canteen': addCanteen(cx, cz); break;
        case 'clinic': addClinic(cx, cz); break;
        case 'shops': addShops(cx, cz); break;
        case 'logistics': addLogistics(cx, cz); break;
        default: addOffice(cx, cz, block.h || 12);
      }
      scatterTrees(cx, cz, 2, random, 4.9);
      if (MAJOR_LABELS.has(block.name)) {
        const y = block.kind === 'library' ? 30.4 : (block.h || 12) + 3.2;
        if (block.kind !== 'library') addLabel(block.name, cx, y, cz, 'major');
      }
      if (block.kind === 'dorm' && i === 3 && j === 4) addLabel('俊园公寓', cx, 19.5, cz, 'major');
    }
  }
}

function buildRoads() {
  for (let k = 0; k <= 8; k++) {
    const p = -64 + k * 16;
    const isAxis = k === 4;
    const width = isAxis ? 6.2 : 3.8;
    boxAt(width, 0.04, 132, p, 0.015, 0, geoRoad, 0x0a111b);
    boxAt(132, 0.04, width, 0, 0.015, p, geoRoad, 0x0a111b);
    // 快车道虚线
    const dash = isAxis ? 2.6 : 2.0;
    for (let t = -62; t <= 62; t += 6.2) {
      const lineV = new THREE.BoxGeometry(0.14, 0.03, dash);
      lineV.translate(p, 0.05, t);
      pushColored(geoMark, lineV, isAxis ? 0x2f6f8c : 0x1d4658);
      const lineH = new THREE.BoxGeometry(dash, 0.03, 0.14);
      lineH.translate(t, 0.05, p);
      pushColored(geoMark, lineH, isAxis ? 0x2f6f8c : 0x1d4658);
    }
  }
  // 校门斑马线
  for (let i = 0; i < 6; i++) {

/* 校门 */
function buildGates() {
  const signTexture = makeSignTexture('四川吉利学院', 'SICHUAN GEELY UNIVERSITY');
  const signMat = new THREE.MeshBasicMaterial({ map: signTexture, color: 0x9fb4c2, transparent: true });

  function gate(x, z, rotY, label, simple = false) {
    const cos = Math.cos(rotY);
    const sin = Math.sin(rotY);
    const place = (lx, lz) => ({ x: x + lx * cos + lz * sin, z: z - lx * sin + lz * cos });

    [-5.2, 5.2].forEach((px) => {
      const p = place(px, 0);
      boxAt(1.1, 6.4, 1.1, p.x, 0, p.z, geoBuilding, 0x202a36, rotY);
      addBeacon(p.x, 6.6, p.z, 0.12);
    });
    const center = place(0, 0);
    boxAt(11.6, 0.7, 0.9, center.x, 6.4, center.z, geoRoof, null, rotY);
    if (!simple) {
      [0, Math.PI].forEach((flip) => {
        const board = new THREE.Mesh(new THREE.PlaneGeometry(9.4, 2.35), signMat);
        const angle = rotY + flip;
        board.position.set(
          center.x + Math.sin(angle) * 0.54,
          5.0,
          center.z + Math.cos(angle) * 0.54
        );
        board.rotation.y = angle;
        scene.add(board);
      });
    }
    const guard = place(7.6, 1.4);
    boxAt(2.6, 2.8, 2.4, guard.x, 0, guard.z, geoBuilding, 0x1c2530, rotY);
    addLabel(label, x, 8.6, z, 'major');
    return center;
  }

  gate(0, 64, 0, '南校门', false);
  gate(64, -16, -Math.PI / 2, '东门', true);
  gate(-64, 0, Math.PI / 2, '西门', true);
}

/* 路灯 */
const lampPositions = [];
function buildLamps() {
  for (let k = 0; k <= 8; k++) {
    for (let m = 0; m <= 8; m++) {
      const x = -64 + k * 16;
      const z = -64 + m * 16;
      if (Math.abs(x) > 60 && Math.abs(z) > 60) continue;
      lampPositions.push({ x: x + 2.4, z: z + 2.4 });
    }
  }
  const poleGeo = new THREE.CylinderGeometry(0.07, 0.09, 4.4, 6);
  const poles = new THREE.InstancedMesh(poleGeo, poleMat, lampPositions.length);
  const headGeo = new THREE.SphereGeometry(0.13, 8, 8);
  const heads = new THREE.InstancedMesh(headGeo, lampMat, lampPositions.length);
  const poolGeo = new THREE.PlaneGeometry(8, 8);
  poolGeo.rotateX(-Math.PI / 2);
  const poolMat = new THREE.MeshBasicMaterial({
    map: glowTexture,
    color: 0xffd9a0,
    transparent: true,
    opacity: 0.1,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const pools = new THREE.InstancedMesh(poolGeo, poolMat, lampPositions.length);
  const dummy = new THREE.Object3D();
  lampPositions.forEach((lamp, index) => {
    dummy.position.set(lamp.x, 2.2, lamp.z);
    dummy.updateMatrix();
    poles.setMatrixAt(index, dummy.matrix);
    dummy.position.set(lamp.x, 4.5, lamp.z);
    dummy.updateMatrix();
    heads.setMatrixAt(index, dummy.matrix);
    dummy.position.set(lamp.x, 0.06, lamp.z);
    dummy.updateMatrix();
    pools.setMatrixAt(index, dummy.matrix);
  });
  scene.add(poles, heads, pools);
}

/* 树木 */
function buildTrees() {
  const broad = seeds.filter((seed) => !seed.pine);
  const pines = seeds.filter((seed) => seed.pine);
  const trunkGeo = new THREE.CylinderGeometry(0.12, 0.2, 1.6, 6);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x241a14, roughness: 0.95 });
  const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, seeds.length);
  const leafGeo = new THREE.IcosahedronGeometry(1.35, 0);
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x123026, roughness: 0.92, flatShading: true });
  const broadMesh = new THREE.InstancedMesh(leafGeo, leafMat, Math.max(broad.length, 1));
  const pineGeo = new THREE.ConeGeometry(1.15, 3.1, 7);
  const pineMat = new THREE.MeshStandardMaterial({ color: 0x0f2a24, roughness: 0.92, flatShading: true });
  const pineMesh = new THREE.InstancedMesh(pineGeo, pineMat, Math.max(pines.length, 1));
  const dummy = new THREE.Object3D();
  seeds.forEach((seed, index) => {
    dummy.position.set(seed.x, 0.8 * seed.s, seed.z);
    dummy.scale.setScalar(seed.s);
    dummy.rotation.set(0, seed.x * 0.3 + seed.z * 0.2, 0);
    dummy.updateMatrix();
    trunks.setMatrixAt(index, dummy.matrix);
  });
  broad.forEach((seed, index) => {
    dummy.position.set(seed.x, 2.4 * seed.s, seed.z);
    dummy.scale.set(seed.s, seed.s * 1.1, seed.s);
    dummy.rotation.set(0, seed.x + seed.z, 0);
    dummy.updateMatrix();
    broadMesh.setMatrixAt(index, dummy.matrix);
  });
  pines.forEach((seed, index) => {
    dummy.position.set(seed.x, 2.5 * seed.s, seed.z);
    dummy.scale.set(seed.s, seed.s, seed.s);
    dummy.rotation.set(0, seed.z * 0.4, 0);
    dummy.updateMatrix();
    pineMesh.setMatrixAt(index, dummy.matrix);
  });
  scene.add(trunks, broadMesh, pineMesh);
}

   3. 六张网：设施、管线、流动粒子与事故演练

const state = {
  timeOfDay: 'night',
  labels: true,
  xray: false,
  tour: false,
  flowSpeed: 1,

function netColor(key) {
  return NET_STYLE[key].hex;
}

/* 设施信标抬升到建筑屋顶以上，避免被楼体遮挡 */
function buildingHeightAt(x, z) {
  const i = Math.max(0, Math.min(7, Math.round((x + 56) / 16)));
  const j = Math.max(0, Math.min(7, Math.round((z + 56) / 16)));
  const block = BLOCK_PLAN[j][i];
  if (!block) return 6;
  switch (block.kind) {
    case 'library': return 27.5;
    case 'teaching': return (block.h || 14) + 1.4;
    case 'lab': return (block.h || 12) + 1.4;
    case 'office': return (block.h || 12) + 1.4;
    case 'hall': return (block.h || 9) + 4.2;
    case 'hangar': return (block.h || 10) + 5.6;
    case 'dorm': return 17.2;
    case 'canteen': return 9.6;
    case 'utility': return 7.4;
    case 'logistics': return 8.6;
    case 'clinic': return 8.8;
    case 'shops': return 5.4;
    default: return 5;
  }
}

function createFlow(net, curve, options = {}) {
  const samples = curve.getSpacedPoints(220);
  const count = options.count || 40;
  const positions = new Float32Array(count * 3);
  const offsets = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    offsets[i] = (i / count + Math.random() * 0.02) % 1;
    const p = samples[0];
    positions[i * 3] = p.x;
    positions[i * 3 + 1] = p.y;
    positions[i * 3 + 2] = p.z;
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const material = new THREE.PointsMaterial({
    color: options.color ?? netColor(net.key),
    size: options.size || 0.42,
    map: glowTexture,
    transparent: true,
    opacity: options.opacity ?? 0.9,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const points = new THREE.Points(geometry, material);
  points.frustumCulled = false;
  net.group.add(points);

  const linePoints = samples.filter((_, i) => i % 4 === 0);
  const lineGeometry = new THREE.BufferGeometry().setFromPoints(linePoints);
  const lineMaterial = new THREE.LineBasicMaterial({
    color: options.lineColor ?? netColor(net.key),
    transparent: true,
    opacity: options.lineOpacity ?? 0.34
  });
  const line = new THREE.Line(lineGeometry, lineMaterial);
  net.group.add(line);

  net.flows.push({
    samples,
    offsets,
    positions,
    geometry,
    speed: options.speed || 0.055,
    size: count
  });
}

function buildNetworks() {
  for (const key of NET_ORDER) {
    const def = NETWORKS[key];
    const group = new THREE.Group();
    group.name = `net-${key}`;
    scene.add(group);

    const net = {
      key,
      def,
      group,
      facilities: [],
      flows: [],
      alert: 'ok',
      flowFactor: 1,
      metrics: { ...def.base },
      trend: []
    };
    netState[key] = net;

    for (const item of def.facilities) {
      const fg = new THREE.Group();
      const baseY = item.y ?? (buildingHeightAt(item.x, item.z) + 1.6);
      fg.position.set(item.x, baseY, item.z);
      const color = netColor(key);

      const coreMat = new THREE.MeshBasicMaterial({ color });
      const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.58, 0), coreMat);
      core.position.y = 1.6;

      const ringGeo = new THREE.RingGeometry(1.0, 1.28, 30);
      ringGeo.rotateX(-Math.PI / 2);
      const ringMat = new THREE.MeshBasicMaterial({
        color,
        transparent: true,
        opacity: 0.6,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.position.y = 0.08;

      const beamMat = new THREE.MeshBasicMaterial({
        color,
        transparent: true,
        opacity: 0.28,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 3.6, 6, 1, true), beamMat);
      beam.position.y = 1.8;

      const glow = new THREE.Sprite(new THREE.SpriteMaterial({
        map: glowTexture,
        color,
        transparent: true,
        opacity: 0.68,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      }));
      glow.scale.setScalar(4.2);
      glow.position.y = 1.7;

      const hit = new THREE.Mesh(
        new THREE.SphereGeometry(2.1, 10, 8),
        new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
      );
      hit.position.y = 1.4;
      hit.userData.facilityId = item.id;
      hit.userData.netKey = key;
      hitMeshes.push(hit);

      fg.add(ring, beam, core, glow, hit);

      const el = document.createElement('div');
      el.className = 'map-label fac';
      el.textContent = item.name;
      const label = new CSS2DObject(el);
      label.position.set(0, 4.3, 0);
      label.userData.netKey = key;
      label.visible = false;
      fg.add(label);
      facilityLabels.push(label);

      group.add(fg);

      const fac = {
        def: item,
        netKey: key,
        group: fg,
        core,
        ring,
        beam,
        glow,
        label,
        labelEl: el,
        status: 'ok',
        load: item.base,
        metrics: { ...item.metrics }
      };
      net.facilities.push(fac);
      facilityIndex.set(item.id, fac);
    }

    const routeY = key === 'tunnel' ? -5.2 : 0.55;
    def.routes.forEach((route, index) => {
      const points = route.map(([x, z]) => new THREE.Vector3(x, routeY, z));
      const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0);
      createFlow(net, curve, {
        count: key === 'tunnel' ? 32 : 44,
        size: key === 'tunnel' ? 0.55 : 0.7,
        speed: key === 'logistics' ? 0.07 : 0.052,
        lineOpacity: index === 0 ? 0.4 : 0.22
      });
    });

    if (def.arcs) {
      def.arcs.forEach(([fromId, toId, height]) => {
        const from = facilityIndex.get(fromId);
        const to = facilityIndex.get(toId);
        if (!from || !to) return;
        const a = new THREE.Vector3(from.def.x, from.group.position.y + 1.8, from.def.z);
        const b = new THREE.Vector3(to.def.x, to.group.position.y + 1.8, to.def.z);
        const mid = a.clone().add(b).multiplyScalar(0.5);
        mid.y += height;
        const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
        createFlow(net, curve, {
          count: 24,
          size: 0.5,
          speed: 0.045,
          opacity: 0.75,
          lineOpacity: 0.4,
          lineColor: 0x9ef0ff
        });
      });
    }

    for (let i = 0; i < 90; i++) {
      net.trend.push(def.base[def.trendKey] * (0.94 + Math.random() * 0.12));
    }
  }
}

buildNetworks();

/* ---------------------------- 设施状态 ---------------------------- */
function setFacilityStatus(fac, status) {
  if (!fac) return;
  fac.status = status;
  const color = status === 'crit' ? 0xff5c6c : status === 'warn' ? 0xffb648 : netColor(fac.netKey);
  fac.core.material.color.setHex(color);
  fac.ring.material.color.setHex(color);
  fac.beam.material.color.setHex(color);
  fac.glow.material.color.setHex(color);
  fac.labelEl.classList.toggle('hot', status !== 'ok');
}

/* ---------------------------- 事故演练 ---------------------------- */
function startIncident(key) {
  if (state.incident) return;
  const def = NETWORKS[key];
  const script = def.incident;
  const net = netState[key];
  state.incident = {
    key,
    script,
    start: performance.now() / 1000,
    stepIndex: -1,
    duration: script.steps[script.steps.length - 1].t + 2.5,
    net
  };
  net.alert = 'warn';
  addEvent('crit', `${def.name}：启动「${script.name}」应急演练`);
  showAlert('crit', `${script.name} · 自动处置演练开始`);
  focusNetwork(key, { fly: true });
  const focusFac = script.focus ? facilityIndex.get(script.focus) : null;
  if (focusFac) {
    setFacilityStatus(focusFac, 'warn');
    const baseY = focusFac.group.position.y;
    const target = new THREE.Vector3(focusFac.def.x, baseY + 1, focusFac.def.z);
    flyTo(new THREE.Vector3(focusFac.def.x + 40, baseY + 32, focusFac.def.z + 42), target, 1.8);
  }
  renderDetail();
}

function updateIncident(now) {
  const inc = state.incident;
  if (!inc) return;
  const elapsed = now - inc.start;
  const steps = inc.script.steps;
  while (inc.stepIndex + 1 < steps.length && steps[inc.stepIndex + 1].t <= elapsed) {
    inc.stepIndex += 1;
    const step = steps[inc.stepIndex];
    inc.net.alert = step.levelState || 'ok';
    inc.net.flowFactor = step.flow;
    addEvent(step.level, `${NETWORKS[inc.key].name}：${step.msg}`);
    showAlert(step.level === 'ok' ? 'info' : step.level, step.msg);
    const focusFac = inc.script.focus ? facilityIndex.get(inc.script.focus) : null;
    if (focusFac) {
      setFacilityStatus(focusFac, step.levelState === 'crit' ? 'crit' : step.levelState === 'warn' ? 'warn' : 'ok');
    }
    renderDetail();
  }
  const progress = Math.min(elapsed / inc.duration, 1);
  const bar = document.querySelector('.incident-progress i');
  if (bar) bar.style.width = `${progress * 100}%`;
  if (elapsed >= inc.duration) {
    state.incident = null;
    inc.net.alert = 'ok';
    inc.net.flowFactor = 1;
    const focusFac = inc.script.focus ? facilityIndex.get(inc.script.focus) : null;
    if (focusFac) setFacilityStatus(focusFac, 'ok');
    addEvent('ok', `${NETWORKS[inc.key].name}：演练结束，系统恢复稳态`);
    renderDetail();
    setTimeout(() => hideAlert(), 2600);
  }
}

/* ---------------------------- 网络聚焦 ---------------------------- */
function setNetworkVisible(key, visible) {
  const net = netState[key];
  if (!net) return;
  state.layers[key] = visible;
  updateNetworkVisibility();
}

/* 聚焦单网时保留其它网的流动管线，但只显示当前网的设施信标 */
function updateNetworkVisibility() {
  for (const key of NET_ORDER) {
    const net = netState[key];
    const layerOn = key === 'tunnel' ? (state.layers[key] || state.xray) : state.layers[key];
    net.group.visible = layerOn;
    const showMarker = layerOn && (!state.activeNet || state.activeNet === key || (key === 'tunnel' && state.xray));
    for (const fac of net.facilities) {
      fac.group.visible = showMarker;
    }
  }
  refreshFacilityLabels();
}

function focusNetwork(key, { fly = false } = {}) {
  state.activeNet = key;
  state.selectedFacility = null;
  if (!state.layers[key]) state.layers[key] = true;
  updateNetworkVisibility();
  if (fly) {
    const net = netState[key];
    const points = net.def.facilities;
    const cx = points.reduce((sum, f) => sum + f.x, 0) / points.length;
    const cz = points.reduce((sum, f) => sum + f.z, 0) / points.length;
    const target = new THREE.Vector3(cx, 6, cz);
    flyTo(new THREE.Vector3(cx + 64, 62, cz + 70), target, 2.0);
  }
  renderLayerPanel();
  renderDetail();
}

const detailView = document.getElementById('detail-view');
const layerList = document.getElementById('layer-list');
const sceneLayerList = document.getElementById('scene-layers');
const tooltipEl = document.getElementById('tooltip');
const alertEl = document.getElementById('alert-banner');
const logEl = document.getElementById('event-log');

const ALERT_TEXT = { ok: '稳态运行', warn: '预警中', crit: '应急处置' };
const eventLog = [];
let alertTimer = null;
let tooltipTimer = null;

function fmtNumber(value, digits = 0) {
  if (!Number.isFinite(value)) return '—';
  return value.toLocaleString('zh-CN', {
    minimumFractionDigits: digits,
    maximumFractionDigits: digits
  });
}

function metricDef(netKey, metricKey) {
  return NETWORKS[netKey].metrics.find((item) => item.key === metricKey) || null;
}

function facReading(fac) {
  const [key, value] = Object.entries(fac.metrics)[0] || [];
  const def = metricDef(fac.netKey, key) || { unit: '', digits: 0 };
  return `${fmtNumber(value, def.digits)} ${def.unit}`;
}

function addEvent(level, message) {
  const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  eventLog.unshift({ level, message, time });
  if (eventLog.length > 80) eventLog.pop();
  const row = document.createElement('div');
  row.className = `log-row ${level}`;
  const timeEl = document.createElement('time');
  timeEl.textContent = time;
  const levelEl = document.createElement('span');
  levelEl.className = 'lv';
  levelEl.textContent = level === 'crit' ? 'CRIT' : level === 'warn' ? 'WARN' : level === 'ok' ? 'OK' : 'INFO';
  const msgEl = document.createElement('span');
  msgEl.textContent = message;
  row.append(timeEl, levelEl, msgEl);
  logEl.prepend(row);
  while (logEl.children.length > 36) logEl.lastChild.remove();
  document.getElementById('log-count').textContent = `${eventLog.length} EVENTS`;
}

function showAlert(level, message) {
  if (!alertEl) return;
  alertEl.hidden = false;
  alertEl.className = level === 'warn' || level === 'info' ? 'warn' : '';
  alertEl.innerHTML = '';
  const tag = document.createElement('b');
  tag.textContent = level === 'crit' ? 'CRITICAL' : level === 'warn' ? 'WARNING' : level === 'info' ? 'HANDLING' : 'RECOVERED';
  const text = document.createElement('span');
  text.textContent = message;
  alertEl.append(tag, text);
  if (alertTimer) clearTimeout(alertTimer);
  if (level === 'ok') alertTimer = setTimeout(hideAlert, 4600);
}

function hideAlert() {
  if (alertEl) alertEl.hidden = true;
}

function healthScore() {
  const alerts = NET_ORDER.filter((key) => netState[key].alert !== 'ok').length;
  const load = NET_ORDER.reduce((sum, key) => sum + loadOf(key), 0) / NET_ORDER.length;
  const score = 100 - alerts * 2.6 - Math.max(0, load * 100 - 62) * 0.12;
  return Math.max(72, Math.min(99.9, score));
}

function loadOf(key) {
  const net = netState[key];
  return net.facilities.reduce((sum, fac) => sum + fac.load, 0) / net.facilities.length;
}

function activeAlerts() {
  return NET_ORDER
    .filter((key) => netState[key].alert !== 'ok')
    .map((key) => ({
      key,
      level: netState[key].alert,
      text: `${NETWORKS[key].name}·${ALERT_TEXT[netState[key].alert]}`
    }));
}

function drawSpark(net) {
  const canvas = document.getElementById('spark-canvas');
  if (!canvas) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const width = canvas.clientWidth || 300;
  const height = canvas.clientHeight || 74;
  if (canvas.width !== Math.floor(width * dpr) || canvas.height !== Math.floor(height * dpr)) {
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, width, height);

  const values = net.trend;
  const color = NET_STYLE[net.key].css;
  let min = Math.min(...values);
  let max = Math.max(...values);
  if (max - min < 0.001) max = min + 1;
  const pad = (max - min) * 0.25;
  min -= pad;
  max += pad;

  ctx.strokeStyle = 'rgba(120, 170, 210, 0.1)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const y = (height / 4) * i;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
    ctx.stroke();
  }

  const points = values.map((value, index) => ({
    x: (index / (values.length - 1)) * width,
    y: height - ((value - min) / (max - min)) * height
  }));

  const gradient = ctx.createLinearGradient(0, 0, 0, height);
  gradient.addColorStop(0, `${color}55`);
  gradient.addColorStop(1, `${color}00`);
  ctx.beginPath();
  ctx.moveTo(0, height);
  for (const p of points) ctx.lineTo(p.x, p.y);
  ctx.lineTo(width, height);
  ctx.closePath();
  ctx.fillStyle = gradient;
  ctx.fill();

  ctx.beginPath();
  points.forEach((p, index) => {
    if (index === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  });
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.6;
  ctx.shadowColor = color;
  ctx.shadowBlur = 8;
  ctx.stroke();
  ctx.shadowBlur = 0;

  const last = points[points.length - 1];
  ctx.beginPath();
  ctx.arc(last.x, last.y, 2.6, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
}

      <div class="spark-head">
        <span>LAST 90s · ${def.trendKey.toUpperCase()}</span>

    <div class="fac-list">${facilities}</div>
    <div class="incident-box">
      <h4>${def.incident.name}</h4>
      <p>${def.incident.brief}</p>
      <button class="incident-btn" type="button" id="btn-incident" ${state.incident ? 'disabled' : ''}>
        ${state.incident ? '演练进行中…' : '▶ 模拟事故并自动处置'}
      </button>

    row.addEventListener('click', () => selectFacility(row.getAttribute('data-fac-row')));
    row.addEventListener('mouseenter', () => {
      const fac = facilityIndex.get(row.getAttribute('data-fac-row'));
      if (fac) highlightFacility(fac, true);
    });
    row.addEventListener('mouseleave', () => {
      const fac = facilityIndex.get(row.getAttribute('data-fac-row'));

function incidentProgress(key) {
  const inc = state.incident;
  if (!inc || inc.key !== key) return 0;
  const elapsed = performance.now() / 1000 - inc.start;
  return Math.min(100, (elapsed / inc.duration) * 100);
}

function highlightFacility(fac, on) {
  fac.glow.material.opacity = on ? 1 : 0.72;
  fac.ring.scale.setScalar(on ? 1.5 : 1);
}

function selectFacility(id) {
  const fac = facilityIndex.get(id);
  if (!fac) return;
  state.selectedFacility = id;
  if (state.activeNet !== fac.netKey) {
    state.activeNet = fac.netKey;
    renderLayerPanel();
  }
  renderDetail();
  const baseY = fac.group.position.y;
  const target = new THREE.Vector3(fac.def.x, baseY + 1, fac.def.z);
  flyTo(new THREE.Vector3(fac.def.x + 34, baseY + 26, fac.def.z + 36), target, 1.4);
}

function updateLive() {
  const key = state.activeNet;
  if (key) {
    const net = netState[key];
    const def = NETWORKS[key];
    for (const item of def.metrics) {
      const node = detailView.querySelector(`[data-live-kpi="${item.key}"]`);
      if (node && node.firstChild) {
        node.firstChild.nodeValue = fmtNumber(net.metrics[item.key], item.digits);
      }
    }
    const sparkValue = detailView.querySelector('[data-spark-value]');
    if (sparkValue) {
      const trendMetric = def.metrics.find((item) => item.key === def.trendKey) || def.metrics[0];
      sparkValue.textContent = `${fmtNumber(net.metrics[def.trendKey], trendMetric.digits)} ${trendMetric.unit}`;
    }
    for (const fac of net.facilities) {
      const node = detailView.querySelector(`[data-fac-val="${fac.def.id}"]`);
      if (node) node.textContent = facReading(fac);
      const dot = detailView.querySelector(`[data-fac-row="${fac.def.id}"] i`);
      if (dot) dot.className = fac.status === 'ok' ? '' : fac.status;
    }
    const pill = detailView.querySelector('[data-status-pill]');
    if (pill) {
      pill.className = `status-pill ${net.alert}`;
      pill.textContent = ALERT_TEXT[net.alert];
    }
    drawSpark(net);
  } else {
    const health = detailView.querySelector('[data-health]');
    if (health) health.innerHTML = `${healthScore().toFixed(1)}<small>%</small>`;
    const load = NET_ORDER.reduce((sum, k) => sum + loadOf(k), 0) / NET_ORDER.length * 100;
    const avg = detailView.querySelector('[data-avg-load]');
    if (avg) avg.innerHTML = `${load.toFixed(0)}<em>%</em>`;
    const alerts = activeAlerts();
    const count = detailView.querySelector('[data-alert-count]');
    if (count) count.textContent = String(alerts.length);
  }

  for (const k of NET_ORDER) {
    const def = NETWORKS[k];
    const metric = def.metrics[0];
    const node = document.querySelector(`[data-layer-count="${k}"]`);
    if (node) node.textContent = `${fmtNumber(netState[k].metrics[metric.key], metric.digits)} ${metric.unit}`;
    const bar = document.querySelector(`[data-mini-bar="${k}"]`);
    if (bar) bar.style.width = `${Math.min(96, loadOf(k) * 100)}%`;
    const value = document.querySelector(`[data-mini-val="${k}"]`);
    if (value) value.textContent = `${fmtNumber(netState[k].metrics[metric.key], metric.digits)} ${metric.unit}`;
  }
  updateFlows();
}

/* ---------------------------- 图层动作 ---------------------------- */
function refreshFacilityLabels() {
  for (const label of facilityLabels) {
    const key = label.userData.netKey;
    label.visible = Boolean(state.labels && state.layers[key] && state.activeNet === key);
  }
}

function toggleNetworkLayer(key) {
  const next = !state.layers[key];
  state.layers[key] = next;
  if (!next && state.activeNet === key) state.activeNet = null;
  updateNetworkVisibility();
  renderLayerPanel();
  renderDetail();
  addEvent('info', `${NETWORKS[key].name}图层已${next ? '显示' : '隐藏'}`);
}

function setBuildingsVisible(visible) {
  state.buildings = visible;
  if (campusMeshes.building) campusMeshes.building.visible = visible;
  if (campusMeshes.roof) campusMeshes.roof.visible = visible;
  if (campusMeshes.trim) campusMeshes.trim.visible = visible;
}

function setRoadsVisible(visible) {
  state.roads = visible;
  if (campusMeshes.road) campusMeshes.road.visible = visible;
  if (campusMeshes.mark) campusMeshes.mark.visible = visible;
}

function setLabelsVisible(visible) {
  state.labels = visible;
  buildingLabels.forEach((label) => { label.visible = visible; });
  refreshFacilityLabels();
  renderSceneLayers();
  addEvent('info', `名称标签已${visible ? '显示' : '隐藏'}`);
}

function setXray(on) {
  state.xray = on;
  if (campusMeshes.building) {
    const mat = campusMeshes.building.material;
    mat.transparent = on;
    mat.opacity = on ? 0.3 : 1;
    mat.depthWrite = !on;
    mat.needsUpdate = true;
  }
  if (campusMeshes.roof) {
    campusMeshes.roof.material.transparent = on;
    campusMeshes.roof.material.opacity = on ? 0.3 : 1;
    campusMeshes.roof.material.depthWrite = !on;
    campusMeshes.roof.material.needsUpdate = true;
  }
  for (const name of ['ground', 'plaza', 'lawn', 'road', 'mark', 'trim']) {
    const mesh = campusMeshes[name];
    if (!mesh) continue;
    const mat = mesh.material;
    mat.transparent = on;
    mat.opacity = on ? (name === 'ground' ? 0.22 : 0.2) : 1;
    mat.depthWrite = !on;
    mat.needsUpdate = true;
  }
  updateNetworkVisibility();
  document.getElementById('btn-xray')?.classList.toggle('is-on', on);
  renderSceneLayers();
  addEvent('info', on ? '地下管廊透视已开启' : '地下管廊透视已关闭');
}

/* ---------------------------- 提示与拾取 ---------------------------- */
function showTooltip(fac, x, y) {
  tooltipEl.hidden = false;
  tooltipEl.innerHTML = '';
  const title = document.createElement('h5');
  title.textContent = fac.def.name;
  const sub = document.createElement('p');
  sub.textContent = `${NETWORKS[fac.netKey].name} · 实时读数`;
  const metrics = document.createElement('div');
  metrics.className = 'tt-metrics';
  for (const [key, value] of Object.entries(fac.metrics)) {
    const def = metricDef(fac.netKey, key);
    if (!def) continue;
    const item = document.createElement('span');
    item.innerHTML = `${def.label} <b>${fmtNumber(value, def.digits)} ${def.unit}</b>`;
    metrics.appendChild(item);
  }
  tooltipEl.append(title, sub, metrics);
  const pad = 14;
  const rect = tooltipEl.getBoundingClientRect();
  const left = Math.min(window.innerWidth - rect.width - pad, x + 14);
  const top = Math.min(window.innerHeight - rect.height - pad, y + 14);
  tooltipEl.style.left = `${left}px`;
  tooltipEl.style.top = `${top}px`;
}

function hideTooltip() {
  tooltipEl.hidden = true;
}

let hoveredFacility = null;

function updateHover(event) {
  if (state.tour) return;
  pointerVec.x = (event.clientX / window.innerWidth) * 2 - 1;
  pointerVec.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointerVec, camera);
  const hits = raycaster.intersectObjects(hitMeshes, false);
  const hit = hits.find((item) => {
    const fac = facilityIndex.get(item.object.userData.facilityId);
    if (!fac || !netState[fac.netKey].group.visible) return false;
    if (fac.netKey === 'tunnel' && !state.xray) return false;
    return true;
  });
  if (!hit) {
    if (hoveredFacility) highlightFacility(hoveredFacility, false);
    hoveredFacility = null;
    hideTooltip();
    renderer.domElement.style.cursor = '';
    return;
  }
  const fac = facilityIndex.get(hit.object.userData.facilityId);
  if (hoveredFacility && hoveredFacility !== fac) highlightFacility(hoveredFacility, false);
  hoveredFacility = fac;
  highlightFacility(fac, true);
  showTooltip(fac, event.clientX, event.clientY);
  renderer.domElement.style.cursor = 'pointer';
}

function onClick(event) {
  if (state.tour) return;
  if (!hoveredFacility) {
    pointerVec.x = (event.clientX / window.innerWidth) * 2 - 1;
    pointerVec.y = -(event.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointerVec, camera);
    const hits = raycaster.intersectObjects(hitMeshes, false);
    const hit = hits.find((item) => {
      const fac = facilityIndex.get(item.object.userData.facilityId);
      if (!fac || !netState[fac.netKey].group.visible) return false;
      if (fac.netKey === 'tunnel' && !state.xray) return false;
      return true;
    });
    if (hit) {
      selectFacility(hit.object.userData.facilityId);
      return;
    }
    if (state.activeNet) {
      state.activeNet = null;
      state.selectedFacility = null;
      renderLayerPanel();
      renderDetail();
    }
    return;
  }
  selectFacility(hoveredFacility.def.id);
}

/* ---------------------------- 镜头飞行与巡游 ---------------------------- */
let flyState = null;
let tourTimer = null;
let tourIndex = 0;

function flyTo(position, target, duration = 1.6) {
  flyState = {
    fromPos: camera.position.clone(),
    toPos: position.clone(),
    fromTarget: controls.target.clone(),
    toTarget: target.clone(),
    t: 0,
    duration
  };
}

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function updateFly(dt) {
  if (!flyState) return;
  flyState.t = Math.min(1, flyState.t + dt / flyState.duration);
  const k = easeInOutCubic(flyState.t);
  camera.position.lerpVectors(flyState.fromPos, flyState.toPos, k);
  controls.target.lerpVectors(flyState.fromTarget, flyState.toTarget, k);
  if (flyState.t >= 1) flyState = null;
}

function startTour() {
  state.tour = true;
  tourIndex = 0;
  document.getElementById('btn-tour')?.classList.add('is-on');
  document.getElementById('btn-tour').textContent = '❚❚ 停止巡游';
  stepTour();
  tourTimer = setInterval(stepTour, 9000);
  addEvent('info', '自动巡游已开启');
}

function stepTour() {
  const stop = TOUR_STOPS[tourIndex % TOUR_STOPS.length];
  tourIndex += 1;
  flyTo(new THREE.Vector3(...stop.pos), new THREE.Vector3(...stop.target), 2.8);
}

function stopTour() {
  if (!state.tour) return;
  state.tour = false;
  if (tourTimer) clearInterval(tourTimer);
  tourTimer = null;
  const btn = document.getElementById('btn-tour');
  btn?.classList.remove('is-on');
  if (btn) btn.textContent = '▶ 自动巡游';
  addEvent('info', '自动巡游已停止');
}

function toggleTour() {
  if (state.tour) stopTour();
  else startTour();
}

function resetView() {
  stopTour();
  state.activeNet = null;
  state.selectedFacility = null;
  flyTo(new THREE.Vector3(92, 104, 142), new THREE.Vector3(0, 0, 4), 1.8);
  renderLayerPanel();
  renderDetail();
  addEvent('info', '视角已复位');
}

/* ---------------------------- 昼夜 ---------------------------- */
function setTimeOfDay(mode) {
  state.timeOfDay = mode;
  const day = mode === 'day';
  scene.background.setHex(day ? 0x5b7f9e : 0x04070d);
  scene.fog.color.setHex(day ? 0x5b7f9e : 0x04070d);
  scene.fog.density = day ? 0.0019 : 0.0034;
  hemiLight.intensity = day ? 1.55 : 0.95;
  hemiLight.color.setHex(day ? 0xa9c9e4 : 0x35597d);
  moonLight.intensity = day ? 1.5 : 0.85;
  moonLight.color.setHex(day ? 0xfff0d8 : 0xbcd4ff);
  ambientLight.intensity = day ? 2.1 : 1.55;
  bloomPass.strength = day ? 0.3 : 0.55;
  windowUniforms.night.value = day ? 0.08 : 1;
  renderer.toneMappingExposure = day ? 1.04 : 0.92;
  if (campusMeshes.ground) {
    campusMeshes.ground.material.color.setHex(day ? 0x9db2c4 : 0x2b3946);
    campusMeshes.ground.material.needsUpdate = true;
  }
  const btn = document.getElementById('btn-daynight');
  if (btn) {
    btn.textContent = day ? '☀ 白天模式' : '☾ 夜间模式';
    btn.classList.toggle('is-on', day);
  }
  addEvent('info', `场景切换至${day ? '白天' : '夜间'}模式`);
}

/* ---------------------------- 初始化 UI ---------------------------- */
function initUI() {
  renderLayerPanel();
  renderSceneLayers();
  buildFlows();
  renderDetail();

  document.getElementById('btn-daynight')?.addEventListener('click', () => {
    setTimeOfDay(state.timeOfDay === 'day' ? 'night' : 'day');
  });
  document.getElementById('btn-xray')?.addEventListener('click', () => setXray(!state.xray));
  document.getElementById('btn-tour')?.addEventListener('click', toggleTour);
  document.getElementById('btn-reset')?.addEventListener('click', resetView);

  const speed = document.getElementById('flow-speed');
  const speedOut = document.getElementById('flow-speed-out');
  speed?.addEventListener('input', () => {
    state.flowSpeed = Number(speed.value);
    if (speedOut) speedOut.textContent = `${state.flowSpeed.toFixed(1)}x`;
  });

  addEvent('ok', '数字孪生底座启动，8×8 街区与 64 个地块加载完成');
  addEvent('info', '六网数据接入：供水 / 电力 / 算力 / 通信 / 地下管廊 / 物流');
  addEvent('info', '本地模拟时钟启动，监测周期 1s，趋势窗口 90s');

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    bloomPass.resolution.set(window.innerWidth, window.innerHeight);
    drawSpark(netState[state.activeNet || 'water']);
  });
}

/* =======================================================================
   5. 模拟循环、粒子流动与渲染
   ======================================================================= */

initUI();

let simAccumulator = 0;
let lastFrame = performance.now() / 1000;

function simulate() {
  const t = performance.now() / 1000;
  NET_ORDER.forEach((key, index) => {
    const net = netState[key];
    const def = NETWORKS[key];
    const phase = index * 1.6;
    const wobble = Math.sin(t * 0.55 + phase) * 0.03 + (Math.random() - 0.5) * 0.01;
    for (const metric of def.metrics) {
      let value = def.base[metric.key] * (1 + wobble);
      if (metric.key === def.trendKey) value *= net.flowFactor;
      if (net.alert === 'crit' && metric.key === def.trendKey) value *= 0.96;
      if (metric.max) value = Math.min(metric.max, value);
      net.metrics[metric.key] = value;
    }
    net.trend.push(net.metrics[def.trendKey]);
    while (net.trend.length > 90) net.trend.shift();

    for (const fac of net.facilities) {
      const target = fac.def.base + Math.sin(t * 0.8 + fac.def.x * 0.12 + fac.def.z * 0.07) * 0.05;
      fac.load += (target - fac.load) * 0.18;
      for (const metricKey of Object.keys(fac.metrics)) {
        const base = fac.def.metrics[metricKey] ?? fac.metrics[metricKey];
        const statusFactor = fac.status === 'crit' ? 0.72 : fac.status === 'warn' ? 0.9 : 1;
        fac.metrics[metricKey] = base * statusFactor * (1 + wobble * 1.2);
      }
    }
  });
  const clock = document.getElementById('sim-clock');
  if (clock) clock.textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
}

function updateFlowsAnimated(delta) {
  const multiplier = state.flowSpeed;
  for (const key of NET_ORDER) {
    const net = netState[key];
    const visible = net.group.visible;
    for (const flow of net.flows) {
      if (!visible) continue;
      const advance = delta * flow.speed * net.flowFactor * multiplier;
      const positions = flow.positions;
      const samples = flow.samples;
      const total = samples.length - 1;
      for (let i = 0; i < flow.size; i++) {
        flow.offsets[i] = (flow.offsets[i] + advance) % 1;
        const point = samples[Math.floor(flow.offsets[i] * total)];
        positions[i * 3] = point.x;
        positions[i * 3 + 1] = point.y;
        positions[i * 3 + 2] = point.z;
      }
      flow.geometry.attributes.position.needsUpdate = true;
    }
  }
}

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now() / 1000;
  const delta = Math.min(0.12, now - lastFrame);
  lastFrame = now;

  updateFly(delta);
  controls.update();
  updateIncident(now);
  updateFlowsAnimated(delta);

  simAccumulator += delta;
  if (simAccumulator >= 1) {
    simAccumulator = 0;
    simulate();
    updateLive();
  }

  composer.render();
  labelRenderer.render(scene, camera);
}

simulate();
animate();

requestAnimationFrame(() => {
  const loading = document.getElementById('loading');
  const status = document.getElementById('loading-status');
  if (status) status.textContent = 'READY · 六网数据接入完成';
  setTimeout(() => loading?.classList.add('is-done'), 220);
});

/* 调试钩子：便于验证渲染与交互，不包含任何敏感信息 */
window.__CITY__ = { scene, camera, renderer, composer, controls, state, netState, facilityIndex, THREE };

/* 首次交互关闭巡游 */
controls.addEventListener('start', () => {
  if (state.tour) stopTour();
});

renderer.domElement.addEventListener('pointermove', updateHover, { passive: true });
renderer.domElement.addEventListener('pointerleave', () => {
  hideTooltip();
  if (hoveredFacility) highlightFacility(hoveredFacility, false);
  hoveredFacility = null;
});
renderer.domElement.addEventListener('click', onClick);

document.addEventListener('keydown', (event) => {
  if (event.target instanceof HTMLInputElement) return;
  const key = event.key.toLowerCase();
  if (key === 'escape') {
    if (state.activeNet) {
      state.activeNet = null;
      state.selectedFacility = null;
      renderLayerPanel();
      renderDetail();
    }
  }
  if (key === 'x') setXray(!state.xray);
  if (key === 'l') setLabelsVisible(!state.labels);
  if (key === 't') toggleTour();
  if (key === 'r') resetView();
  if (key === 'n') setTimeOfDay(state.timeOfDay === 'day' ? 'night' : 'day');
  const number = Number(event.key);
  if (number >= 1 && number <= 6) {
    const netKey = NET_ORDER[number - 1];
    if (!state.layers[netKey]) toggleNetworkLayer(netKey);
    focusNetwork(netKey, { fly: true });
  }
});
</script>
