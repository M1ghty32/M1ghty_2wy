<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>四川吉利学院 · 校园漫游</title>
<style>
  :root { --cyan:#38e1ff; --mono:"JetBrains Mono",Consolas,monospace; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#050b12; color:#e6f2fb; font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif; }
  #scene { position:fixed; inset:0; }
  canvas { display:block; }

  #hud { position:fixed; inset:0; pointer-events:none; z-index:5; }
  #brand { position:absolute; top:18px; left:20px; }
  #brand b { display:block; font-size:15px; letter-spacing:.1em; }
  #brand span { color:#7f95a8; font-family:var(--mono); font-size:9px; letter-spacing:.18em; }

  #help { position:absolute; left:20px; bottom:20px; padding:10px 12px; border:1px solid rgba(120,190,220,.18); border-radius:10px; background:rgba(5,14,24,.68); backdrop-filter:blur(8px); font-family:var(--mono); font-size:9px; line-height:1.9; color:#8fa6b8; }
  #help b { color:#d7ecfa; font-weight:500; }

  #crosshair { position:absolute; left:50%; top:50%; width:5px; height:5px; margin:-2.5px 0 0 -2.5px; border-radius:50%; background:rgba(220,245,255,.85); box-shadow:0 0 8px rgba(56,225,255,.7); }

  #prompt { position:absolute; left:50%; bottom:22%; transform:translateX(-50%); padding:9px 16px; border:1px solid rgba(56,225,255,.45); border-radius:10px; background:rgba(5,18,28,.78); color:#d8f4ff; font-size:13px; letter-spacing:.05em; opacity:0; transition:opacity .18s; white-space:nowrap; }
  #prompt.show { opacity:1; }
  #prompt em { color:var(--cyan); font-style:normal; font-family:var(--mono); }

  #nameplate { position:absolute; left:50%; top:14%; transform:translateX(-50%); color:#cfe6f5; font-size:12px; letter-spacing:.2em; opacity:0; transition:opacity .3s; text-shadow:0 2px 12px #000; }
  #nameplate.show { opacity:1; }

  #loading { position:fixed; inset:0; z-index:20; display:grid; place-items:center; background:#050b12; transition:opacity .5s; }
  #loading.hide { opacity:0; pointer-events:none; }
  #loading b { display:block; font-size:13px; letter-spacing:.2em; margin-bottom:12px; text-align:center; }
  #loading i { display:block; width:180px; height:2px; background:rgba(120,190,220,.16); }
  #loading em { display:block; width:40%; height:100%; background:var(--cyan); animation:slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0%{transform:translateX(0)} 50%{transform:translateX(150%)} 100%{transform:translateX(0)} }
</style>
<script type="importmap">
{ "imports": { "three": "../vendor/three.module.js", "three/addons/": "../vendor/three-addons/" } }
</script>
</head>
<body>
<div id="scene"></div>
<div id="hud">
  <div id="brand"><b>四川吉利学院 · 校园漫游</b><span>CAMPUS WALK · WASD / MOUSE / E</span></div>
  <div id="help">
    <div><b>W A S D</b> 移动 · <b>Shift</b> 奔跑 · <b>空格</b> 跳跃</div>
    <div><b>鼠标</b> 转视角 · 点击画面锁定</div>
    <div><b>E</b> 进入 / 离开建筑</div>
  </div>
  <div id="crosshair"></div>
  <div id="prompt"></div>
  <div id="nameplate"></div>
</div>
<div id="loading"><div><b>正在生成校园</b><i><em></em></i></div></div>

<script type="module">
import * as THREE from 'three';

const container = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.6));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ec6dd);
scene.fog = new THREE.Fog(0xb9d6e6, 260, 1250);

const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.3, 4000);

const data = await fetch('../data/campus-v2.json').then((r) => r.json());
const surfaces = await fetch('../data/campus-surfaces.json').then((r) => r.json()).catch(() => null);

/* ---------- 边界 ---------- */
const bounds = { minX: Infinity, maxX: -Infinity, minZ: Infinity, maxZ: -Infinity };
for (const b of data.buildings) for (const ring of b.r) for (const p of ring) {
  bounds.minX = Math.min(bounds.minX, p[0]); bounds.maxX = Math.max(bounds.maxX, p[0]);
  bounds.minZ = Math.min(bounds.minZ, p[1]); bounds.maxZ = Math.max(bounds.maxZ, p[1]);
}
const mid = { x: (bounds.minX + bounds.maxX) / 2, z: (bounds.minZ + bounds.maxZ) / 2 };
const span = Math.max(bounds.maxX - bounds.minX, bounds.maxZ - bounds.minZ);

/* ---------- 光照 ---------- */
const hemi = new THREE.HemisphereLight(0xbfd9ee, 0x43503c, 1.0);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.1);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 900;
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

/* ---------- 地面 ---------- */
const groundMat = new THREE.MeshStandardMaterial({ color: 0x3d5a38, roughness: 1 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(span * 2.6, span * 2.6), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.set(mid.x, 0, mid.z);
ground.receiveShadow = true;
scene.add(ground);

/* ---------- 地表：官方 surface 数据 ---------- */
function surfaceMesh(item, color, y, opacity = 1) {
  const rings = item && item.r;
  if (!rings || !rings.length) return;
  const shape = new THREE.Shape();
  const ring = rings[0];
  shape.moveTo(ring[0][0], -ring[0][1]);
  for (let i = 1; i < ring.length; i++) shape.lineTo(ring[i][0], -ring[i][1]);
  for (const hole of rings.slice(1)) {
    const p = new THREE.Path();
    p.moveTo(hole[0][0], -hole[0][1]);
    for (let i = 1; i < hole.length; i++) p.lineTo(hole[i][0], -hole[i][1]);
    shape.holes.push(p);
  }
  const geo = new THREE.ShapeGeometry(shape);
  geo.rotateX(-Math.PI / 2);
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, roughness: 1, transparent: opacity < 1, opacity }));
  mesh.position.y = y;
  mesh.receiveShadow = true;
  scene.add(mesh);
}
if (surfaces) {
  for (const b of surfaces.campusBoundary || []) surfaceMesh(b, 0x93ad7c, 0.004);
  for (const g of surfaces.green || []) surfaceMesh(g, 0x7f9e69, 0.008);
  for (const p of surfaces.paving || []) surfaceMesh(p, 0xb9bebc, 0.012);
  for (const p of surfaces.parkingAreas || []) surfaceMesh(p, 0x9aa0a4, 0.016);
  for (const p of surfaces.parkingBays || []) surfaceMesh(p, 0xd6dadb, 0.02);
}

/* ---------- 水系 ---------- */
const waterMat = new THREE.MeshStandardMaterial({ color: 0x2c7fa6, roughness: 0.18, metalness: 0.35, transparent: true, opacity: 0.92 });
for (const ring of data.water) {
  const shape = new THREE.Shape();
  shape.moveTo(ring[0][0], -ring[0][1]);
  for (let i = 1; i < ring.length; i++) shape.lineTo(ring[i][0], -ring[i][1]);
  shape.closePath();
  const geo = new THREE.ShapeGeometry(shape);
  geo.rotateX(-Math.PI / 2);
  const mesh = new THREE.Mesh(geo, waterMat);
  mesh.position.y = 0.06;
  scene.add(mesh);
}

/* ---------- 道路 ---------- */
const ROAD_W = { primary: 11, secondary: 9, tertiary: 8, living_street: 6, service: 5, path: 3, pedestrian: 3, steps: 2.4, track: 3 };
const roadMat = new THREE.MeshStandardMaterial({ color: 0x6b7178, roughness: 0.92 });
const walkMat = new THREE.MeshStandardMaterial({ color: 0xa8aea8, roughness: 0.95 });
function ribbon(points, width) {
  const pts = [];
  for (const p of points) {
    const v = new THREE.Vector3(p[0], 0, p[1]);
    if (!pts.length || pts[pts.length - 1].distanceTo(v) > 0.8) pts.push(v);
  }
  if (pts.length < 2) return null;
  const pos = [], idx = [], nor = [];
  for (let i = 0; i < pts.length; i++) {
    const prev = pts[Math.max(0, i - 1)], next = pts[Math.min(pts.length - 1, i + 1)];
    const dir = new THREE.Vector3().subVectors(next, prev).normalize();
    const side = new THREE.Vector3(-dir.z, 0, dir.x).multiplyScalar(width / 2);
    pos.push(pts[i].x - side.x, 0, pts[i].z - side.z, pts[i].x + side.x, 0, pts[i].z + side.z);
    nor.push(0, 1, 0, 0, 1, 0);
    if (i < pts.length - 1) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setIndex(idx);
  return g;
}
const roadGeos = [], walkGeos = [];
for (const road of data.roads) {
  const w = ROAD_W[road.w] || 4;
  for (const line of road.l) {
    const a = ribbon(line, w); if (a) roadGeos.push(a);
    const b = ribbon(line, w + 4.5); if (b) walkGeos.push(b);
  }
}
function merge(list) {
  const parts = list.map((g) => (g.index ? g.toNonIndexed() : g));
  let total = 0; for (const g of parts) total += g.attributes.position.count;
  const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3);
  let o = 0;
  for (const g of parts) { pos.set(g.attributes.position.array, o); nor.set(g.attributes.normal.array, o); o += g.attributes.position.count * 3; }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  return geo;
}
const walkMesh = new THREE.Mesh(merge(walkGeos), walkMat); walkMesh.position.y = 0.03; walkMesh.receiveShadow = true; scene.add(walkMesh);
const roadMesh = new THREE.Mesh(merge(roadGeos), roadMat); roadMesh.position.y = 0.05; roadMesh.receiveShadow = true; scene.add(roadMesh);

/* ---------- 建筑 ---------- */
const buildingMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.78, metalness: 0.05 });
buildingMat.onBeforeCompile = (shader) => {
  shader.vertexShader = 'varying vec3 vWPos;\nvarying vec3 vWN;\n' + shader.vertexShader.replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\n vWPos=(modelMatrix*vec4(transformed,1.0)).xyz;\n vWN=normalize(mat3(modelMatrix)*objectNormal);');
  shader.fragmentShader = 'varying vec3 vWPos;\nvarying vec3 vWN;\n' + shader.fragmentShader.replace('#include <dithering_fragment>', `#include <dithering_fragment>
    float wall = 1.0 - smoothstep(0.45,0.62,abs(vWN.y));
    float fy = fract((vWPos.y - 1.2)/3.6);
    float fx = fract((vWPos.x + vWPos.z)/4.2);
    float win = step(0.5,fx)*step(fx,0.9)*step(0.28,fy)*step(fy,0.8);
    vec3 glass = vec3(0.24,0.36,0.45);
    float lit = step(0.72, fract(sin(dot(floor(vWPos.xz/4.2), vec2(12.9898,78.233)))*43758.5453));
    vec3 col = mix(glass, vec3(1.0,0.86,0.6), lit*0.55);
    gl_FragColor.rgb = mix(gl_FragColor.rgb, col, win*wall*0.8);`);
};
const KIND_COLOR = { library: 0xe7e2d8, teaching: 0xe3e7ea, student_bedroom: 0xd9cdb8, gymnasium: 0xd3dbe1, canteen: 0xded0ba, experiment_building: 0xcdd8df, administration: 0xe2dccf, service_building: 0xd8d2c8, hospital: 0xe4e7e9 };
const YARD = 0;
const buildingMeshes = [];
const buildingData = [];
for (const b of data.buildings) {
  const ring = b.r[0];
  if (!ring || ring.length < 3) continue;
  const shape = new THREE.Shape();
  shape.moveTo(ring[0][0], -ring[0][1]);
  for (let i = 1; i < ring.length; i++) shape.lineTo(ring[i][0], -ring[i][1]);
  shape.closePath();
  const h = Math.max(4, b.h || 12);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false, curveSegments: 1 });
  geo.rotateX(-Math.PI / 2);
  const color = new THREE.Color(KIND_COLOR[b.k] || 0xd5dde4);
  const count = geo.attributes.position.count;
  const colors = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) { colors[i * 3] = color.r; colors[i * 3 + 1] = color.g; colors[i * 3 + 2] = color.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mesh = new THREE.Mesh(geo, buildingMat);
  mesh.castShadow = true; mesh.receiveShadow = true;
  scene.add(mesh);
  buildingMeshes.push(mesh);

  const xs = ring.map((p) => p[0]), zs = ring.map((p) => p[1]);
  buildingData.push({ name: b.n, kind: b.k, h, cx: (Math.min(...xs) + Math.max(...xs)) / 2, cz: (Math.min(...zs) + Math.max(...zs)) / 2, minX: Math.min(...xs), maxX: Math.max(...xs), minZ: Math.min(...zs), maxZ: Math.max(...zs), ring });
}

/* ---------- 树 ---------- */
const treePts = (data.trees || []).slice(0, 900);
if (treePts.length) {
  const trunkGeo = new THREE.CylinderGeometry(0.25, 0.34, 4, 6); trunkGeo.translate(0, 2, 0);
  const crownGeo = new THREE.IcosahedronGeometry(2.6, 1); crownGeo.translate(0, 5.6, 0);
  const trunks = new THREE.InstancedMesh(trunkGeo, new THREE.MeshStandardMaterial({ color: 0x5a4632, roughness: 1 }), treePts.length);
  const crowns = new THREE.InstancedMesh(crownGeo, new THREE.MeshStandardMaterial({ color: 0x4f7a44, roughness: 1, flatShading: true }), treePts.length);
  const m = new THREE.Matrix4();
  treePts.forEach((p, i) => {
    const s = 0.8 + (i % 6) * 0.07;
    m.makeScale(s, s * (0.9 + (i % 4) * 0.08), s); m.setPosition(p[0], 0, p[1]);
    trunks.setMatrixAt(i, m); crowns.setMatrixAt(i, m);
  });
  trunks.castShadow = true; crowns.castShadow = true;
  scene.add(trunks, crowns);
}

/* ---------- 南门 ---------- */
const gateGroup = new THREE.Group();
gateGroup.position.set(204.7, 0, 442);
for (const side of [-1, 1]) {
  const pillar = new THREE.Mesh(new THREE.BoxGeometry(2.6, 9, 2.6), new THREE.MeshStandardMaterial({ color: 0xc9d1d8, roughness: 0.6 }));
  pillar.position.set(side * 11, 4.5, 0); pillar.castShadow = true; gateGroup.add(pillar);
}
const beam = new THREE.Mesh(new THREE.BoxGeometry(24.6, 1.5, 3), new THREE.MeshStandardMaterial({ color: 0xc9d1d8, roughness: 0.6 }));
beam.position.y = 9.3; beam.castShadow = true; gateGroup.add(beam);
const signCanvas = document.createElement('canvas'); signCanvas.width = 1024; signCanvas.height = 192;
const sc = signCanvas.getContext('2d');
sc.fillStyle = '#2b2f36'; sc.fillRect(0, 0, 1024, 192);
sc.fillStyle = '#f2ede2'; sc.font = 'bold 92px "Microsoft YaHei", sans-serif'; sc.textAlign = 'center'; sc.textBaseline = 'middle';
sc.fillText('四川吉利学院', 512, 96);
const signTex = new THREE.CanvasTexture(signCanvas);
const sign = new THREE.Mesh(new THREE.PlaneGeometry(18, 3.2), new THREE.MeshBasicMaterial({ map: signTex }));
sign.position.set(0, 6.6, 1.55); gateGroup.add(sign);
scene.add(gateGroup);

/* ---------- 主站同款场地与细节 ---------- */
function ellipseField(cx, cz, rx, rz, color, y) {
  const shape = new THREE.Shape();
  shape.absellipse(0, 0, rx, rz, 0, Math.PI * 2, false, 0);
  const geo = new THREE.ShapeGeometry(shape, 48);
  geo.rotateX(-Math.PI / 2);
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, roughness: 0.92 }));
  mesh.position.set(cx, y, cz); mesh.receiveShadow = true; scene.add(mesh);
}
ellipseField(-88, -222, 54, 99, 0x9d4b3f, 0.1);
ellipseField(-88, -222, 36, 79, 0x2f6b3a, 0.14);

const basketMat = new THREE.MeshStandardMaterial({ color: 0x3e6f8f, roughness: 0.9 });
const lineWhite = new THREE.MeshBasicMaterial({ color: 0xe8eef2 });
function courtLine(w, d, x, z, rot) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), lineWhite);
  m.rotation.x = -Math.PI / 2; m.rotation.z = rot; m.position.set(x, 0.1, z);
  scene.add(m);
}
for (let i = 0; i < 4; i++) {
  const cx = 12 - (i % 2) * 30;
  const cz = -288 - Math.floor(i / 2) * 26;
  const court = new THREE.Mesh(new THREE.PlaneGeometry(26, 14), basketMat);
  court.rotation.x = -Math.PI / 2; court.rotation.z = -0.05;
  court.position.set(cx, 0.085, cz); scene.add(court);
  courtLine(24, 0.4, cx, cz + 5.6, -0.05);
  courtLine(24, 0.4, cx, cz - 5.6, -0.05);
  courtLine(0.4, 14, cx - 13, cz, -0.05);
  courtLine(0.4, 14, cx + 13, cz, -0.05);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 3.2, 6), new THREE.MeshStandardMaterial({ color: 0x4a545c }));
  pole.position.set(cx - 12.4, 1.6, cz); scene.add(pole);
}
for (let i = 0; i < 2; i++) {
  const cx = 58, cz = -258 - i * 22;
  const court = new THREE.Mesh(new THREE.PlaneGeometry(24, 11), new THREE.MeshStandardMaterial({ color: 0x3f7a55, roughness: 0.9 }));
  court.rotation.x = -Math.PI / 2; court.rotation.z = -0.05;
  court.position.set(cx, 0.085, cz); scene.add(court);
  courtLine(22, 0.35, cx, cz + 4.4, -0.05);
  courtLine(22, 0.35, cx, cz - 4.4, -0.05);
  courtLine(0.35, 11, cx - 11, cz, -0.05);
  courtLine(0.35, 11, cx + 11, cz, -0.05);
}

const pavingMat = new THREE.MeshStandardMaterial({ color: 0x9aa2a8, roughness: 0.9 });
for (const p of [[205, 300, 96, 150], [208, -18, 104, 62], [205, 455, 60, 26]]) {
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(p[2], p[3]), pavingMat);
  mesh.rotation.x = -Math.PI / 2; mesh.position.set(p[0], 0.055, p[1]);
  mesh.receiveShadow = true; scene.add(mesh);
}

const bankMat = new THREE.MeshStandardMaterial({ color: 0xb9c2b4, roughness: 1 });
for (const ring of data.water) {
  const cx = ring.reduce((a, p) => a + p[0], 0) / ring.length;
  const cz = ring.reduce((a, p) => a + p[1], 0) / ring.length;
  const shape = new THREE.Shape();
  ring.forEach((p, i) => {
    const x = cx + (p[0] - cx) * 1.045, z = cz + (p[1] - cz) * 1.045;
    if (i === 0) shape.moveTo(x, -z); else shape.lineTo(x, -z);
  });
  shape.closePath();
  const geo = new THREE.ShapeGeometry(shape); geo.rotateX(-Math.PI / 2);
  const mesh = new THREE.Mesh(geo, bankMat); mesh.position.y = 0.045; scene.add(mesh);
}

// 图书馆红砖立面
const lib = buildingData.find((b) => b.name === '图书馆');
if (lib) {
  const w = Math.min(26, (lib.maxX - lib.minX) * 0.34);
  const h = Math.min(26, lib.h * 0.5);
  const panel = new THREE.Mesh(new THREE.BoxGeometry(w, h, 1.2), new THREE.MeshStandardMaterial({ color: 0x8a4a3a, roughness: 0.85 }));
  panel.position.set(lib.cx, lib.h * 0.5, lib.maxZ + 0.5); scene.add(panel);
  const c = document.createElement('canvas'); c.width = 1024; c.height = 192;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#f5efe4'; ctx.font = 'bold 96px "Microsoft YaHei", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('图书馆', 512, 96);
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.7, w * 0.18), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, alphaTest: 0.05 }));
  sign.position.set(lib.cx, lib.h * 0.62, lib.maxZ + 1.15); scene.add(sign);
  for (let i = 0; i < 8; i++) {
    const louver = new THREE.Mesh(new THREE.BoxGeometry(lib.maxX - lib.minX + 2, 0.35, 0.5), new THREE.MeshStandardMaterial({ color: 0xdde3e8, roughness: 0.6 }));
    louver.position.set(lib.cx, 4 + i * ((lib.h - 8) / 7), lib.maxZ + 0.2); scene.add(louver);
  }
}
for (const name of ['体育馆', '游泳馆']) {
  const b = buildingData.find((x) => x.name === name);
  if (!b) continue;
  const r = Math.min((b.maxX - b.minX) / 2, (b.maxZ - b.minZ) / 2) * 0.55;
  const dome = new THREE.Mesh(new THREE.SphereGeometry(r, 28, 14, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0xd6dde3, roughness: 0.45, metalness: 0.25 }));
  dome.scale.y = 0.3; dome.position.set(b.cx, b.h * 0.8, b.cz); dome.castShadow = true; scene.add(dome);
}

// 其它三座校门
for (const g of [{ n: '西南门', x: -294.7, z: 254.4, r: Math.PI / 2 }, { n: '北门', x: -62, z: -830, r: Math.PI }, { n: '东门', x: 688, z: 322, r: -Math.PI / 2 }]) {
  const grp = new THREE.Group();
  grp.position.set(g.x, 0, g.z); grp.rotation.y = g.r;
  for (const side of [-1, 1]) {
    const p = new THREE.Mesh(new THREE.BoxGeometry(1.8, 6, 1.8), new THREE.MeshStandardMaterial({ color: 0x3a444c, roughness: 0.7 }));
    p.position.set(side * 7, 3, 0); p.castShadow = true; grp.add(p);
  }
  const beam = new THREE.Mesh(new THREE.BoxGeometry(15.6, 1, 2.2), new THREE.MeshStandardMaterial({ color: 0x3a444c, roughness: 0.7 }));
  beam.position.y = 6.2; grp.add(beam);
  scene.add(grp);
}

/* ---------- 碰撞网格 ---------- */
const CELL = 3;
const gw = Math.ceil((bounds.maxX - bounds.minX) / CELL) + 2;
const gh = Math.ceil((bounds.maxZ - bounds.minZ) / CELL) + 2;
const blocked = new Uint8Array(gw * gh);
function pointInRing(x, z, ring) {

}
for (const b of buildingData) {

  const z0 = Math.floor((b.minZ - bounds.minZ) / CELL), z1 = Math.ceil((b.maxZ - bounds.minZ) / CELL);
  for (let gx = Math.max(0, x0); gx <= Math.min(gw - 1, x1); gx++) {
    for (let gz = Math.max(0, z0); gz <= Math.min(gh - 1, z1); gz++) {
      const wx = bounds.minX + (gx + 0.5) * CELL, wz = bounds.minZ + (gz + 0.5) * CELL;
      if (pointInRing(wx, wz, b.ring)) blocked[gz * gw + gx] = 1;
    }
  }
}
for (const ring of data.water) {
  let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
  for (const p of ring) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); z0 = Math.min(z0, p[1]); z1 = Math.max(z1, p[1]); }
  for (let gx = Math.max(0, Math.floor((x0 - bounds.minX) / CELL)); gx <= Math.min(gw - 1, Math.ceil((x1 - bounds.minX) / CELL)); gx++) {
    for (let gz = Math.max(0, Math.floor((z0 - bounds.minZ) / CELL)); gz <= Math.min(gh - 1, Math.ceil((z1 - bounds.minZ) / CELL)); gz++) {
      const wx = bounds.minX + (gx + 0.5) * CELL, wz = bounds.minZ + (gz + 0.5) * CELL;

}

function samplePath(path, t) {
  const n = path.length - 1;
  const f = Math.min(0.9999, Math.max(0, t)) * n;
  const i = Math.floor(f), a = path[i], b = path[Math.min(n, i + 1)];

  return { x: a[0] + (b[0] - a[0]) * k, z: a[1] + (b[1] - a[1]) * k, dx: b[0] - a[0], dz: b[1] - a[1] };
}

const promptEl = document.getElementById('prompt');

    promptEl.classList.add('show');

  for (const d of doors) {

    if (dist < bestD) { bestD = dist; best = d; }
  }
  nearDoor = best;

    promptEl.classList.add('show');
  } else promptEl.classList.remove('show');
}
function interact() {
  if (state.mode === 'indoor') {
    state.mode = 'outdoor';
    room.visible = false;
    playerPos.copy(state.saved);
    state.saved = null;
    nameEl.classList.remove('show');
    return;
  }
  if (!nearDoor) return;
  state.saved = playerPos.clone();
  state.mode = 'indoor';
  state.indoorName = nearDoor.name;
  room.visible = true;
  playerPos.set(4000, 0, 4000 - ROOM.d / 2 + 4);
  state.yaw = Math.PI;

}

/* ---------- 更新 ---------- */
const clock = new THREE.Clock();
const tmpF = new THREE.Vector3(), tmpR = new THREE.Vector3();
function update(dt) {
  state.clock += dt;
  // 移动
  let mx = 0, mz = 0;
  if (keys.has('w') || keys.has('arrowup')) mz += 1;
  if (keys.has('s') || keys.has('arrowdown')) mz -= 1;
  if (keys.has('a') || keys.has('arrowleft')) mx -= 1;
  if (keys.has('d') || keys.has('arrowright')) mx += 1;
  const len = Math.hypot(mx, mz) || 1;
  mx /= len; mz /= len;
  const speed = keys.has('shift') ? 13 : 6.4;
  tmpF.set(-Math.sin(state.yaw), 0, -Math.cos(state.yaw));
  tmpR.set(Math.cos(state.yaw), 0, -Math.sin(state.yaw));
  const dx = (tmpF.x * mz + tmpR.x * mx) * speed * dt;
  const dz = (tmpF.z * mz + tmpR.z * mx) * speed * dt;

  if (state.mode === 'outdoor') {
    const nx = playerPos.x + dx, nz = playerPos.z + dz;
    if (!isBlocked(nx, playerPos.z)) playerPos.x = nx;
    if (!isBlocked(playerPos.x, nz)) playerPos.z = nz;
    state.vy -= 22 * dt;
    playerPos.y += state.vy * dt;
    if (playerPos.y <= 0) { playerPos.y = 0; state.vy = 0; state.ground = true; }
  } else {
    const hw = ROOM.w / 2 - 0.8, hd = ROOM.d / 2 - 0.8;
    playerPos.x = Math.max(4000 - hw, Math.min(4000 + hw, playerPos.x + dx));
    playerPos.z = Math.max(4000 - hd, Math.min(4000 + hd, playerPos.z + dz));
    playerPos.y = 0;
  }

  player.position.copy(playerPos);
  player.rotation.y = state.yaw + Math.PI;

  // 走路摆臂
  const moving = (mx || mz) && state.mode === 'outdoor';
  const swing = moving ? Math.sin(state.clock * 9) * 0.6 : 0;
  player.userData.lLeg.rotation.x = swing;
  player.userData.rLeg.rotation.x = -swing;
  player.userData.lArm.rotation.x = -swing;
  player.userData.rArm.rotation.x = swing;

  // 相机
  const dist = state.mode === 'indoor' ? 5.5 : 11;
  const height = state.mode === 'indoor' ? 2.2 : 4.2;
  const cx = playerPos.x + Math.sin(state.yaw) * Math.cos(state.pitch) * dist;
  const cz = playerPos.z + Math.cos(state.yaw) * Math.cos(state.pitch) * dist;
  const cy = playerPos.y + height + Math.sin(-state.pitch) * dist * 0.5;
  camera.position.lerp(new THREE.Vector3(cx, cy, cz), Math.min(1, dt * 12));
  camera.lookAt(playerPos.x, playerPos.y + 1.6, playerPos.z);

  // 太阳跟随
  sun.position.set(playerPos.x + 220, 320, playerPos.z + 160);
  sun.target.position.set(playerPos.x, 0, playerPos.z);
  sun.target.updateMatrixWorld();

  // NPC
  for (const n of npcs) {
    n.t += (dt * n.speed) / Math.max(1, n.path.length * 6) * n.dir;
    if (n.t > 1) { n.t = 1; n.dir = -1; }
    if (n.t < 0) { n.t = 0; n.dir = 1; }
    const p = samplePath(n.path, n.t);
    const yaw = n.mesh.userData.idle ? n.mesh.userData.phase : Math.atan2(p.dx * n.dir, p.dz * n.dir);
    n.mesh.position.set(p.x, 0, p.z);
    n.mesh.rotation.y = yaw;
    const sw = n.mesh.userData.idle ? 0 : Math.sin(state.clock * 7 + n.mesh.userData.phase) * 0.55;
    const idleBob = n.mesh.userData.idle ? Math.sin(state.clock * 1.6 + n.mesh.userData.phase) * 0.03 : 0;
    n.mesh.position.y = idleBob;
    n.mesh.userData.lLeg.rotation.x = sw;
    n.mesh.userData.rLeg.rotation.x = -sw;
    n.mesh.userData.lArm.rotation.x = -sw;
    n.mesh.userData.rArm.rotation.x = sw;
    n.mesh.visible = state.mode === 'outdoor';
  }

  // 室内外显隐
  for (const m of buildingMeshes) m.visible = state.mode === 'outdoor';
  ground.visible = state.mode === 'outdoor';
  player.visible = true;

  updatePrompt();
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  update(dt);
  renderer.render(scene, camera);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

playerPos.set(204, 0, 350);
camera.position.set(204, 6, 361);
animate();
document.getElementById('loading').classList.add('hide');
window.__GAME__ = { scene, camera, renderer, player, playerPos, state, doors, npcs, isBlocked, buildingData };
</script>
